provider: github
payload_object_required: false
secret:
  required: true
signature:
  type: hmac_sha256
  header: X-Hub-Signature-256
  prefix: sha256=
  signed_payload: raw_body
  missing_error: invalid github signature
  invalid_error: invalid github signature
delivery_id:
  header: X-GitHub-Delivery
  required: true
  missing_error: github delivery id is required
event_type:
  header: X-GitHub-Event
  required: true
  missing_error: github event type is required
event_name:
  template: inbound.github.raw.{event_type}
normalized_events:
  - event: inbound.github.issue_comment_created
    fields:
      installation_id:
        from: installation.id
        schema: {type: integer, minimum: 1}
      repository_owner:
        from: repository.owner.login
        schema: {type: string, minLength: 1}
      repository_name:
        from: repository.name
        schema: {type: string, minLength: 1}
      issue_number:
        from: issue.number
        schema: {type: integer, minimum: 1}
      body:
        from: comment.body
        schema: {type: string}
      comment_author_type:
        from: comment.user.type
        schema: {type: string, minLength: 1}
      sender_type:
        from: sender.type
        schema: {type: string, minLength: 1}
    when:
      one_of:
        action: [created]
  - event: inbound.github.issue_opened
    fields:
      installation_id:
        from: installation.id
        schema: {type: integer, minimum: 1}
      repository_owner:
        from: repository.owner.login
        schema: {type: string, minLength: 1}
      repository_name:
        from: repository.name
        schema: {type: string, minLength: 1}
      issue_number:
        from: issue.number
        schema: {type: integer, minimum: 1}
      title:
        from: issue.title
        schema: {type: string, minLength: 1}
    when:
      absent: [comment]
      one_of:
        action: [opened]
ack:
  mode: after_publish
metadata:
  user_agent: user_agent
  github_delivery: delivery_id
  github_event: event_type
