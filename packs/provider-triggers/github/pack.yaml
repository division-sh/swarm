id: provider.github
version: 0.1.0
platform_version: '>=0.7.0 <0.8.0'
type: trigger
manifest_hash: sha256:3df85cfd90cbd7fd349cbde2e1f3cbec8a974c4866a0af128d5df70ca9658f01
provenance:
    source: platform
capabilities:
    can:
        receive_https_route: /webhooks/{alias}/github
        verify_secret: webhook_signing.github
        emit_events:
            - inbound.github.issue_comment_created
            - inbound.github.issue_opened
            - inbound.github.raw.{event_type}
        persist_dedupe_markers: true
    cannot:
        - emit_undeclared_events
        - run_code_before_admission
        - touch_unbound_resources
requires:
    secrets:
        - webhook_signing.github
tests:
    - providertriggers/github
