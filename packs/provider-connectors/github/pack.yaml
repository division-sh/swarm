id: provider.github.connector
version: 0.1.0
platform_version: '>=0.7.0 <0.8.0'
type: connector
manifest_hash: sha256:95cf8119c6f2efdb6916298dc9162d117f60a4333120b5f4c7edbb951c512118
provenance:
    source: platform
capabilities:
    can:
        call_provider_actions:
            - github.add_labels_to_issue
            - github.create_issue
            - github.create_issue_comment
        lower_through_activity: true
        journal_activity_attempts: true
    cannot:
        - bypass activity_attempts
        - retry non_idempotent_write automatically
        - expose credential values
requires:
    managed_credentials:
        - github_app
tests:
    - providerconnectors/github_pack
    - runtime/github_app_issue_workflow_supported_surface
