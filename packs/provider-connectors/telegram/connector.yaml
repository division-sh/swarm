provider: telegram
tools:
  telegram.send_message:
    category: provider_connector
    description: send Telegram messages
    handler_type: http
    effect_class: non_idempotent_write
    credentials:
      - telegram_bot_token
    input_schema:
      type: object
      properties:
        chat_id:
          type: string
        text:
          type: string
      required:
        - chat_id
        - text
    response_success:
      kind: http_status_2xx
    http:
      method: POST
      url: https://api.telegram.org/bot{{credentials.telegram_bot_token}}/sendMessage
      body:
        chat_id: "{{input.chat_id}}"
        text: "{{input.text}}"
  telegram.send_interactive:
    category: provider_connector
    description: send a Telegram direct-message presentation with optional actions
    handler_type: http
    effect_class: non_idempotent_write
    credentials: [telegram_bot_token]
    input_schema:
      type: object
      additionalProperties: false
      required: [chat_id, text, reply_markup]
      properties:
        chat_id: {type: string, pattern: '^-?[0-9]+$', minLength: 1, maxLength: 17}
        text: {type: string, minLength: 1, maxLength: 4096}
        reply_markup:
          type: object
          additionalProperties: false
          required: [inline_keyboard]
          properties:
            inline_keyboard:
              type: array
              minItems: 0
              maxItems: 8
              items:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [text, callback_data]
                  properties:
                    text: {type: string, minLength: 1, maxLength: 64}
                    callback_data: {type: string, pattern: '^[A-Za-z0-9_-]+$', minLength: 1, maxLength: 64}
    output_schema:
      type: object
      additionalProperties: false
      required: [message_id]
      properties:
        message_id: {type: integer, minimum: 1, maximum: 2147483647}
    response_success:
      kind: json_field_equals
      path: response.body.ok
      equals: true
    response_mapping:
      message_id: "{{response.body.result.message_id}}"
    http:
      method: POST
      url: https://api.telegram.org/bot{{credentials.telegram_bot_token}}/sendMessage
      body:
        chat_id: "{{input.chat_id}}"
        text: "{{input.text}}"
        reply_markup: "{{input.reply_markup}}"
  telegram.edit_message:
    category: provider_connector
    description: replace a Telegram direct-message presentation and controls
    handler_type: http
    effect_class: non_idempotent_write
    credentials: [telegram_bot_token]
    input_schema:
      type: object
      additionalProperties: false
      required: [chat_id, message_id, text, reply_markup]
      properties:
        chat_id: {type: string, pattern: '^-?[0-9]+$', minLength: 1, maxLength: 17}
        message_id: {type: integer, minimum: 1, maximum: 2147483647}
        text: {type: string, minLength: 1, maxLength: 4096}
        reply_markup:
          type: object
          additionalProperties: false
          required: [inline_keyboard]
          properties:
            inline_keyboard:
              type: array
              minItems: 0
              maxItems: 8
              items:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [text, callback_data]
                  properties:
                    text: {type: string, minLength: 1, maxLength: 64}
                    callback_data: {type: string, pattern: '^[A-Za-z0-9_-]+$', minLength: 1, maxLength: 64}
    output_schema:
      type: object
      additionalProperties: false
      required: [message_id]
      properties:
        message_id: {type: integer, minimum: 1, maximum: 2147483647}
    response_success:
      kind: json_field_equals
      path: response.body.ok
      equals: true
    response_mapping:
      message_id: "{{response.body.result.message_id}}"
    http:
      method: POST
      url: https://api.telegram.org/bot{{credentials.telegram_bot_token}}/editMessageText
      body:
        chat_id: "{{input.chat_id}}"
        message_id: "{{input.message_id}}"
        text: "{{input.text}}"
        reply_markup: "{{input.reply_markup}}"
  telegram.answer_callback:
    category: provider_connector
    description: acknowledge one Telegram callback interaction
    handler_type: http
    effect_class: non_idempotent_write
    credentials: [telegram_bot_token]
    input_schema:
      type: object
      additionalProperties: false
      required: [callback_query_id]
      properties:
        callback_query_id: {type: string, minLength: 1}
    output_schema:
      type: object
      additionalProperties: false
      required: [acknowledged]
      properties:
        acknowledged:
          type: boolean
          enum: [true]
    response_success:
      kind: json_field_equals
      path: response.body.ok
      equals: true
    response_mapping:
      acknowledged: "{{response.body.result}}"
    http:
      method: POST
      url: https://api.telegram.org/bot{{credentials.telegram_bot_token}}/answerCallbackQuery
      body:
        callback_query_id: "{{input.callback_query_id}}"
  telegram.install_inbox_commands:
    category: provider_connector
    description: install the Open inbox command for one Telegram chat
    handler_type: http
    effect_class: non_idempotent_write
    credentials: [telegram_bot_token]
    input_schema:
      type: object
      additionalProperties: false
      required: [chat_id, commands]
      properties:
        chat_id: {type: string, pattern: '^-?[0-9]+$', minLength: 1, maxLength: 17}
        commands:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [command, description]
            properties:
              command: {type: string, minLength: 1, maxLength: 32}
              description: {type: string, minLength: 1, maxLength: 256}
    output_schema:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted: {type: boolean}
    response_success:
      kind: json_field_equals
      path: response.body.ok
      equals: true
    response_mapping:
      accepted: "{{response.body.result}}"
    http:
      method: POST
      url: https://api.telegram.org/bot{{credentials.telegram_bot_token}}/setMyCommands
      body:
        scope:
          type: chat
          chat_id: "{{input.chat_id}}"
        commands: "{{input.commands}}"
  telegram.read_inbox_commands:
    category: provider_registration
    description: read commands for one Telegram chat
    handler_type: http
    effect_class: read_only
    credentials: [telegram_bot_token]
    input_schema:
      type: object
      additionalProperties: false
      required: [chat_id]
      properties:
        chat_id: {type: string, pattern: '^-?[0-9]+$', minLength: 1, maxLength: 17}
    output_schema:
      type: object
      additionalProperties: false
      required: [commands]
      properties:
        commands:
          type: array
          minItems: 0
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [command, description]
            properties:
              command: {type: string, minLength: 1, maxLength: 32}
              description: {type: string, minLength: 1, maxLength: 256}
    response_success:
      kind: json_field_equals
      path: response.body.ok
      equals: true
    response_mapping:
      commands: "{{response.body.result}}"
    http:
      method: POST
      url: https://api.telegram.org/bot{{credentials.telegram_bot_token}}/getMyCommands
      body:
        scope:
          type: chat
          chat_id: "{{input.chat_id}}"
  telegram.install_shared_inbox_commands:
    category: provider_connector
    description: install Open inbox for one Telegram group member
    handler_type: http
    effect_class: non_idempotent_write
    credentials: [telegram_bot_token]
    input_schema:
      type: object
      additionalProperties: false
      required: [chat_id, user_id, commands]
      properties:
        chat_id: {type: string, pattern: '^-?[0-9]+$', minLength: 1, maxLength: 17}
        user_id: {type: string, pattern: '^[0-9]+$', minLength: 1, maxLength: 17}
        commands:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [command, description]
            properties:
              command: {type: string, minLength: 1, maxLength: 32}
              description: {type: string, minLength: 1, maxLength: 256}
    output_schema:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted: {type: boolean}
    response_success:
      kind: json_field_equals
      path: response.body.ok
      equals: true
    response_mapping:
      accepted: "{{response.body.result}}"
    http:
      method: POST
      url: https://api.telegram.org/bot{{credentials.telegram_bot_token}}/setMyCommands
      body:
        scope:
          type: chat_member
          chat_id: "{{input.chat_id}}"
          user_id: "{{input.user_id}}"
        commands: "{{input.commands}}"
  telegram.read_shared_inbox_commands:
    category: provider_registration
    description: read Open inbox commands for one Telegram group member
    handler_type: http
    effect_class: read_only
    credentials: [telegram_bot_token]
    input_schema:
      type: object
      additionalProperties: false
      required: [chat_id, user_id]
      properties:
        chat_id: {type: string, pattern: '^-?[0-9]+$', minLength: 1, maxLength: 17}
        user_id: {type: string, pattern: '^[0-9]+$', minLength: 1, maxLength: 17}
    output_schema:
      type: object
      additionalProperties: false
      required: [commands]
      properties:
        commands:
          type: array
          minItems: 0
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [command, description]
            properties:
              command: {type: string, minLength: 1, maxLength: 32}
              description: {type: string, minLength: 1, maxLength: 256}
    response_success:
      kind: json_field_equals
      path: response.body.ok
      equals: true
    response_mapping:
      commands: "{{response.body.result}}"
    http:
      method: POST
      url: https://api.telegram.org/bot{{credentials.telegram_bot_token}}/getMyCommands
      body:
        scope:
          type: chat_member
          chat_id: "{{input.chat_id}}"
          user_id: "{{input.user_id}}"
  telegram.identify_bot:
    category: provider_registration
    description: identify the Telegram bot webhook slot
    handler_type: http
    effect_class: read_only
    credentials: [telegram_bot_token]
    input_schema:
      type: object
      additionalProperties: false
    output_schema:
      type: object
      additionalProperties: false
      required: [bot_id]
      properties:
        bot_id: {type: integer, minimum: 1, maximum: 4503599627370495}
    response_success:
      kind: json_field_equals
      path: response.body.ok
      equals: true
    response_mapping:
      bot_id: "{{response.body.result.id}}"
    http:
      method: GET
      url: https://api.telegram.org/bot{{credentials.telegram_bot_token}}/getMe
  telegram.apply_webhook:
    category: provider_registration
    description: register the current Swarm callback generation
    handler_type: http
    effect_class: non_idempotent_write
    credentials: [telegram_bot_token, webhook_signing_secret]
    input_schema:
      type: object
      additionalProperties: false
      required: [callback_url]
      properties:
        callback_url: {type: string, minLength: 1}
    output_schema:
      type: object
      additionalProperties: false
      required: [applied]
      properties:
        applied: {type: boolean, enum: [true]}
    response_success:
      kind: json_field_equals
      path: response.body.ok
      equals: true
    response_mapping:
      applied: "{{response.body.result}}"
    http:
      method: POST
      url: https://api.telegram.org/bot{{credentials.telegram_bot_token}}/setWebhook
      body:
        url: "{{input.callback_url}}"
        secret_token: "{{credentials.webhook_signing_secret}}"
  telegram.read_webhook:
    category: provider_registration
    description: read the current Telegram webhook callback
    handler_type: http
    effect_class: read_only
    credentials: [telegram_bot_token]
    input_schema:
      type: object
      additionalProperties: false
    output_schema:
      type: object
      additionalProperties: false
      required: [callback_url]
      properties:
        callback_url: {type: string}
    response_success:
      kind: json_field_equals
      path: response.body.ok
      equals: true
    response_mapping:
      callback_url: "{{response.body.result.url}}"
    http:
      method: GET
      url: https://api.telegram.org/bot{{credentials.telegram_bot_token}}/getWebhookInfo
