id: provider.telegram.connector
version: 0.1.0
platform_version: ">=0.7.0 <0.8.0"
type: connector
manifest_hash: sha256:aaaa01c40039fa7280990732bc733421a02403db2df349326d2e865bb565ecd9
provenance:
  source: platform
capabilities:
  can:
    call_provider_actions:
      - telegram.answer_callback
      - telegram.apply_webhook
      - telegram.edit_message
      - telegram.identify_bot
      - telegram.read_webhook
      - telegram.send_interactive
      - telegram.send_message
    lower_through_activity: true
    journal_activity_attempts: true
  cannot:
    - bypass activity_attempts
    - retry non_idempotent_write automatically
    - expose credential values
requires:
  secrets:
    - telegram_bot_token
    - webhook_signing_secret
tests:
  - providerconnectors/telegram_pack
  - runtime/telegram_connector_supported_surface
