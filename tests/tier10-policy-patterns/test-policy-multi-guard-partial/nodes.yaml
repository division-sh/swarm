validator:
  check.requested:
    rules:
      - when: (payload.score >= policy.min_score) && (payload.confidence >= policy.min_confidence) && (has(entity.depth) && entity.depth <= policy.max_depth) && (has(entity.flag_count) && entity.flag_count == 0) && (has(entity.item_count) && entity.item_count < policy.max_items)
        advances_to: accepted
