evaluator:
  id: evaluator
  execution_type: system_node
  subscribes_to: [score.final]
  produces: [result.demoted]
  event_handlers:
    score.final:
      data_accumulation:
        writes:
          - main_score
          - secondary_score
      on_complete:
        - element_id: 6eab3cb7-c0ef-4a09-812f-61459f4c53c4
          condition: "payload.main_score >= policy.high_mark AND payload.secondary_score >= policy.hard_floor"
          advances_to: promoted
        - element_id: d74a7a01-cc1b-4acc-86ba-c777f77bb946
          condition: "payload.main_score >= policy.low_mark"
          advances_to: demoted
          emit:
            event: result.demoted
        - element_id: e77815e9-2d4e-4f31-a91d-8b7734b016c0
          condition: "else"
          advances_to: rejected
