classifier:
  id: classifier
  execution_type: system_node
  subscribes_to: [eval.submitted]
  produces: [eval.tier_b]
  event_handlers:
    eval.submitted:
      data_accumulation:
        writes:
          - score
      on_complete:
        - element_id: b54d7c49-1474-408e-b253-f9151b2a2010
          condition: "payload.score >= policy.high_mark"
          advances_to: tier_a
        - element_id: 1e89f35e-eae2-4c0a-b7d0-d2649808548b
          condition: "payload.score >= policy.low_mark"
          advances_to: tier_b
          emit:
            event: eval.tier_b
        - element_id: 35125f03-b997-40d8-872a-6b92e73c1fff
          condition: "else"
          advances_to: tier_c
