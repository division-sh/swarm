classifier:
  eval.submitted:
    data_accumulation:
      writes:
        - score
    on_complete:
      - condition: payload.score >= policy.high_mark
        advances_to: tier_a
      - condition: payload.score >= policy.low_mark
        advances_to: tier_b
        emit:
          event: eval.tier_b
      -
        advances_to: tier_c
