test-node:
  execution_type: system_node
  subscribes_to: [state.reset_requested]
  produces: [state.reset_completed]
  event_handlers:
    state.reset_requested:
      data_accumulation:
        writes:
          - op: clear
            target: entity.dedup_key
          - op: clear
            target: entity.accumulated_count
      clear:
        targets:
          - accumulator_state
      emit:
        event: state.reset_completed
      advances_to: cleared
