processor-node:
  execution_type: system_node
  subscribes_to: [process.run]
  produces: [process.done]
  event_handlers:
    process.run:
      guard:
        id: task_config_present
        check: has(entity.task_config)
      data_accumulation:
        writes:
          - target_field: result
            value:
              status: processed
      advances_to: finished
      emit:
        event: process.done
