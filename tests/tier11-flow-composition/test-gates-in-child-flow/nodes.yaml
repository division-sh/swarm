router:
  execution_type: system_node
  subscribes_to:
    - validate.requested
    - validation.done
  produces: []

  event_handlers:
    validate.requested:
      guard:
        id: selected_owner
        check: "has(entity.id) || !has(entity.id)"
      emit: child/validate.start
    validation.done:
      guard:
        id: check_child_gate
        check: _entity.gates['child/g_validated'] == true
      advances_to: done
