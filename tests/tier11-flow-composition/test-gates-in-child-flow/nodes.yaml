router:
  execution_type: system_node
  subscribes_to:
    - validate.requested
    - validation.done
  produces: []

  event_handlers:
    validate.requested:
      emit: child/validate.start
    validation.done:
      guard:
        id: check_child_gate
        check: _entity.gates['child/g_validated'] == true
      advances_to: done
