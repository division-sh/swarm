name: child
version: 1.0.0
description: Mid-level child flow that delegates to grandchild.
platform_version: ">=0.7.0 <0.8.0"
flows:
- id: grandchild
  flow: grandchild
  mode: static
connect:
  - event: micro.start
    from: .
    to: grandchild
  - event: micro.done
    from: grandchild
    to: .
    adapter: grandchild_micro_done_to_child_micro_done
