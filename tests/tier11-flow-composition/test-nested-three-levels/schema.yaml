initial_state: idle
terminal_states: [done]
states: [idle, done]
pins:
  inputs:
    events:
      - pipeline.start
      - micro.done
  outputs:
    events:
      - step.begin
connect:
  - event: step.begin
    from: .
    to: child
  - event: micro.relayed
    from: child
    to: .
    rename: micro.done
