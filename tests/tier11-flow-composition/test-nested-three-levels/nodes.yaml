root-dispatcher:
  id: root-dispatcher
  execution_type: system_node
  subscribes_to: [pipeline.start]
  produces: [step.begin]
  event_handlers:
    pipeline.start:
      guard:
        id: selected_owner
        check: "has(entity.id) || !has(entity.id)"
      emit: step.begin

root-collector:
  id: root-collector
  execution_type: system_node
  subscribes_to: [micro.done]
  produces: []
  event_handlers:
    micro.done:
      advances_to: done
