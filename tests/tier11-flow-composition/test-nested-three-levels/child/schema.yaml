name: child
stages:
  waiting: {initial: true}
  delegated: {}
  completed: {terminal: true}
pins:
  inputs:
    events:
      - step.begin
      - micro.done
  outputs:
    events:
      - micro.start
      - micro.relayed
connect:
  - event: micro.start
    from: .
    to: grandchild
  - event: micro.done
    from: grandchild
    to: .
