name: child
stages:
  waiting: {initial: true}
  delegated: {}
  completed: {terminal: true}
pins:
  inputs:
    - step.begin
    - micro.done
  outputs:
    - micro.start
    - micro.relayed
connect:
  - event: micro.start
    from: .
    to: grandchild
  - event: micro.done
    from: grandchild
    to: .
