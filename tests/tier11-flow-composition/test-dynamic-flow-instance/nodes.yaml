orchestrator:
  id: orchestrator
  execution_type: system_node
  subscribes_to: [spawn.requested]
  produces: []
  event_handlers:
    spawn.requested:
      action: create_flow_instance
      template: worker
      instance_id_from: payload.worker_id
      config_from:
        worker_id: payload.worker_id
        task_label: payload.task_label
      advances_to: spawned

assigner:
  id: assigner
  execution_type: system_node
  subscribes_to: [assign.requested]
  produces: [work.assign]
  event_handlers:
    assign.requested:
      emit:
        event: work.assign
        fields:
          worker_id: payload.worker_id
          task_label: payload.task_label
      advances_to: done
