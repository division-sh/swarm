orchestrator:
  spawn.requested:
    emit:
      event: worker.requested
      fields:
        worker_id: payload.worker_id
        task_label: payload.task_label
    advances_to: spawned

assigner:
  assign.requested:
    emit:
      event: work.assign
      fields:
        worker_id: payload.worker_id
        task_label: payload.task_label
    advances_to: done
