name: worker
mode: template
instance: worker_id
initial_state: idle
terminal_states: [complete]
states: [idle, complete]
instance_variables:
  worker_id: string
  task_label: string
auto_emit_on_create:
  event: work.setup
pins:
  inputs:
    events:
      - work.setup
      - event: work.assign
        resolution:
          mode: select
