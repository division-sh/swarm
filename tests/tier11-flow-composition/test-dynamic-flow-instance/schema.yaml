name: test-dynamic-flow-instance
initial_state: pending
terminal_states: [done]
states: [pending, spawned, done]
pins:
  inputs:
    events: [spawn.requested, assign.requested]
  outputs:
    events: [work.assign, worker.requested]
connect:
  - event: worker.requested
    from: .
    to: worker
  - event: work.assign
    from: .
    to: worker
