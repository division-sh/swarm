name: test-dynamic-flow-instance
stages:
  pending: {}
  spawned: {}
  done: {final: true}
pins:
  inputs:
    - spawn.requested
    - assign.requested
  outputs:
    - work.assign
    - worker.requested
connect:
  - event: worker.requested
    from: .
    to: worker
    resolution: create
  - event: work.assign
    from: .
    to: worker
    resolution: select
