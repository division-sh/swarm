name: worker
mode: template
instance: worker_id
stages:
  idle: {initial: true}
  complete: {terminal: true}
instance_variables:
  variables:
    task_label: text
auto_emit_on_create:
  event: work.setup
pins:
  inputs:
    events:
      - event: worker.requested
        resolution: {mode: create}
        initialize:
          task_label: payload.task_label
      - work.setup
      - event: work.assign
        resolution:
          mode: select
