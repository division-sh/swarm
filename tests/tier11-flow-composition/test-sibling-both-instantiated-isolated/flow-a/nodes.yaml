alpha-intake:
  execution_type: system_node
  subscribes_to: [work.begin]
  produces: [internal.step2]
  event_handlers:
    work.begin:
      advances_to: active
      emit: internal.step2

alpha-processor:
  execution_type: system_node
  subscribes_to: [internal.step2]
  produces: []
  event_handlers:
    internal.step2:
      advances_to: processed
