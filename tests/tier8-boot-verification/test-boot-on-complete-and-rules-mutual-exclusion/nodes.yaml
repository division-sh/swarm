test-node:
  id: test-node
  execution_type: system_node
  subscribes_to: [task.submitted]
  produces: []
  event_handlers:
    task.submitted:
      on_complete:
        - condition: "payload.score >= 70"
          advances_to: done
      rules:
        route_a:
          condition: "payload.type == \"a\""
          advances_to: routed
