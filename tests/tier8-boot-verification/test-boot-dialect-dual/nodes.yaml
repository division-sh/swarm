dual-dialect-node:
  execution_type: system_node
  subscribes_to: [check.requested]
  produces: []
  event_handlers:
    check.requested:
      on_complete:
        - condition: "payload.score >= 70"
          advances_to: done
      rules:
        - id: high_score
          when: "payload.score >= 70"
        - id: unmatched
          else: true
      advances_to: done
