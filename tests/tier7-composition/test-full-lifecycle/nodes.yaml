validation-node:
  order.submitted:
    guard: payload.amount >= policy.min_amount
    advances_to: validated
    data_accumulation:
      writes:
        - {target_field: validation_passed, value: true}
    emit: order.validated

completion-node:
  order.validated:
    guard: state.validation_passed == true
    advances_to: complete
    emit:
      event: order.finalized
