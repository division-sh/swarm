validation-node:
  execution_type: system_node
  subscribes_to: [order.submitted]
  produces: [order.validated]
  event_handlers:
    order.submitted:
      guard:
        id: amount_check
        check: payload.amount >= policy.min_amount
      advances_to: validated
      data_accumulation:
        writes:
          - {target_field: validation_passed, value: 'true'}
      emit: order.validated

completion-node:
  execution_type: system_node
  subscribes_to: [order.validated]
  produces: [order.finalized]
  event_handlers:
    order.validated:
      guard:
        id: gate_check
        check: state.validation_passed == true
      advances_to: complete
      emit:
        event: order.finalized
