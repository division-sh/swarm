validation-node:
  gate_state:
    validation_passed: gate set when validation succeeds
  order.submitted:
    guard:
      id: amount_check
      check: payload.amount >= policy.min_amount
    advances_to: validated
    sets_gate: validation_passed
    emit: order.validated

completion-node:
  order.validated:
    guard:
      id: gate_check
      check: _entity.gates.validation_passed == true
    advances_to: complete
    emit:
      event: order.finalized
