gate-setter-1:
  gate.g1_set:
    data_accumulation:
      writes:
        - {target_field: g1, value: true}
    emit:
      event: gate.set

gate-setter-2:
  gate.g2_set:
    data_accumulation:
      writes:
        - {target_field: g2, value: true}
    emit:
      event: gate.set

gate-setter-3:
  gate.g3_set:
    data_accumulation:
      writes:
        - {target_field: g3, value: true}
    emit:
      event: gate.set

approval-node:
  approval.requested:
    guard: state.g1 == true && state.g2 == true && state.g3 == true
    advances_to: approved
    emit:
      event: approval.granted
