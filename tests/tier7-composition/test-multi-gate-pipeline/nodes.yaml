gate-setter-1:
  gate_state:
    g1: first gate in the approval pipeline
  gate.g1_set:
    sets_gate: g1
    emit:
      event: gate.set

gate-setter-2:
  gate_state:
    g2: second gate in the approval pipeline
  gate.g2_set:
    sets_gate: g2
    emit:
      event: gate.set

gate-setter-3:
  gate_state:
    g3: third gate in the approval pipeline
  gate.g3_set:
    sets_gate: g3
    emit:
      event: gate.set

approval-node:
  approval.requested:
    guard:
      id: all_gates_check
      check: _entity.gates.g1 == true && _entity.gates.g2 == true && _entity.gates.g3 == true
    advances_to: approved
    emit:
      event: approval.granted
