gate-setter-1:
  execution_type: system_node
  subscribes_to: [gate.g1_set]
  produces: [gate.set]
  event_handlers:
    gate.g1_set:
      data_accumulation:
        writes:
          - {target_field: g1, value: 'true'}
      emit:
        event: gate.set

gate-setter-2:
  execution_type: system_node
  subscribes_to: [gate.g2_set]
  produces: [gate.set]
  event_handlers:
    gate.g2_set:
      data_accumulation:
        writes:
          - {target_field: g2, value: 'true'}
      emit:
        event: gate.set

gate-setter-3:
  execution_type: system_node
  subscribes_to: [gate.g3_set]
  produces: [gate.set]
  event_handlers:
    gate.g3_set:
      data_accumulation:
        writes:
          - {target_field: g3, value: 'true'}
      emit:
        event: gate.set

approval-node:
  execution_type: system_node
  subscribes_to: [approval.requested]
  produces: [approval.granted]
  event_handlers:
    approval.requested:
      guard:
        id: all_gates_check
        check: state.g1 == true && state.g2 == true && state.g3 == true
      advances_to: approved
      emit:
        event: approval.granted
