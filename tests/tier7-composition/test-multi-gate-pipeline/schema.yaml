name: test-multi-gate-pipeline
stages:
  pending: {initial: true}
  approved: {terminal: true}
pins:
  inputs:
    events: [gate.g1_set, gate.g2_set, gate.g3_set, approval.requested]
  outputs:
    events:
      - event: approval.granted
        sink: harness
      - event: gate.set
        sink: harness
