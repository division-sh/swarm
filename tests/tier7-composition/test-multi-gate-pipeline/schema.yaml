name: test-multi-gate-pipeline
initial_state: pending
terminal_states: [approved]
states: [pending, approved]
pins:
  inputs:
    events: [gate.g1_set, gate.g2_set, gate.g3_set, approval.requested]
  outputs:
    events:
      - event: approval.granted
        sink: harness
      - event: gate.set
        sink: harness
