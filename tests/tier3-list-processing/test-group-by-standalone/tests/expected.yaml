trigger:
  event: items.submitted
  payload:
    items:
      - name: a
        category: x
      - name: b
        category: y
      - name: c
        category: x

expected:

  handler_outcome: success
  entity_state: done
  emitted_events:
    - items.grouped
  entity_fields:
    grouped:
      x:
        - name: a
          category: x
        - name: c
          category: x
      y:
        - name: b
          category: y

conformance:
  disposition: runtime
  verify: pass
  proves:
    - catalog.runtime.list_processing
  public_companion:
    path: tests/visible-smoke.yaml
    proof_role: protocol-only
