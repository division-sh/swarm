owner:
  work.opened:
    advances_to: assess
  work.annotated:
    guard: instance.stage == 'assess'
    data_accumulation:
      writes: [review_note]
  work.assessed:
    guard: instance.stage == 'assess'
    data_accumulation:
      writes:
        - business_brief
        - target_field: attempt_count
          value: state.attempt_count + 1
    advances_to: consume
    emit:
      event: work.consume
  work.consume:
    guard: instance.stage == 'consume'
    data_accumulation:
      writes:
        - op: clear
          target: state.review_note
    emit:
      event: work.completed
      fields:
        business_brief: state.business_brief
        note_supplied: has(state.review_note)
        attempt_count: state.attempt_count
  work.completed:
    guard: instance.stage == 'consume' && payload.business_brief == state.business_brief && payload.attempt_count == state.attempt_count && !payload.note_supplied
    advances_to: done
