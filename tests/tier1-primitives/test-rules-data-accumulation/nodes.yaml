test-node:
  execution_type: system_node
  subscribes_to: [item.received]
  produces: []
  event_handlers:
    item.received:
      rules:
        type_a:
          when: "payload.kind == 'a'"
          data_accumulation:
            writes:
              - value
        unmatched:
          else: true
  state_schema:
    fields:
      value: integer
