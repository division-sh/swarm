test-node:
  id: test-node
  execution_type: system_node
  subscribes_to: [item.evaluated]
  produces: [item.expedited]
  event_handlers:
    item.evaluated:
      on_complete:
        - element_id: 9c85e8fa-42af-47bf-b77f-6fa4db8a15f8
          condition: "entity.priority == 'high'"
          emit:
            event: item.expedited
          advances_to: done
  state_schema:
    fields:
      priority: string
