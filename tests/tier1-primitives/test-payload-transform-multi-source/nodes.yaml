test-node:
  execution_type: system_node
  subscribes_to: [export.requested]
  produces: [item.exported]
  event_handlers:
    export.requested:
      advances_to: done
      emit:
        event: item.exported
        fields:
          id: instance.id
          name: state.name
          status: instance.stage
  state_schema:
    fields:
      name: string
