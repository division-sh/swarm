test-node:
  execution_type: system_node
  subscribes_to: [evidence.submitted]
  produces: [evidence.recorded]
  event_handlers:
    evidence.submitted:
      data_accumulation:
        writes:
          - op: append
            target: entity.findings
            value:
              cel: '{"finding": payload.finding, "severity": payload.severity}'
      emit:
        event: evidence.recorded
