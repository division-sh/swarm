test-node:
  id: test-node
  execution_type: system_node
  subscribes_to: [item.received]
  produces: [routed.unknown]
  event_handlers:
    item.received:
      rules:
        type_a:
          element_id: c396c279-c123-42ec-9a7a-46efb1906415
          condition: "payload.kind == 'a'"
        unknown:
          element_id: df6cfe33-05db-48a5-8618-93f1fabbbfef
          condition: "else"
          emit:
            event: routed.unknown
