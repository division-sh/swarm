initial_state: pending
terminal_states: [complete]
states: [pending, processing, complete]
pins:
  inputs:
    events: [step.first, step.second]
  outputs:
    events:
      - name: step.first_done
        event: step.first_done
        sink: harness
      - name: step.second_done
        event: step.second_done
        sink: harness
