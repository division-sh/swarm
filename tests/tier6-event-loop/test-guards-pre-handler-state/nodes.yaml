processor:
  execution_type: system_node
  subscribes_to: [process.requested]
  produces: []
  event_handlers:
    process.requested:
      guard:
        id: counter_check
        check: has(state.counter) && state.counter < 3
      data_accumulation:
        writes:
          - target_field: counter
            value: state.counter + 1
      advances_to: processing
