phase-one:
  task.started:
    data_accumulation:
      writes:
        - batch_id
    on_complete:
      - condition: payload.ready == true
        advances_to: processing
        emit: phase.advanced
phase-two:
  phase.advanced:
    guard: has(entity.batch_id) && entity.batch_id != ""
    advances_to: done
    emit:
      event: task.done
