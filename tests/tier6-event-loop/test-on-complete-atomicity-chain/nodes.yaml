phase-one:
  task.started:
    data_accumulation:
      writes:
        - batch_id
    on_complete:
      - condition: payload.ready == true
        advances_to: processing
        emit: phase.advanced
phase-two:
  phase.advanced:
    guard:
      id: verify_state_committed
      check: has(entity.batch_id) && entity.batch_id != ""
      on_fail: reject
    advances_to: done
    emit:
      event: task.done
