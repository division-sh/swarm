retrier:
  execution_type: system_node
  subscribes_to: [retry.requested]
  produces: [limit.reached]
  event_handlers:
    retry.requested:
      guard:
        id: under_limit
        check: state.retry_count < policy.max_retries
        on_fail: "escalate:limit.reached"
      data_accumulation:
        writes:
          - target_field: retry_count
            value: state.retry_count + 1
