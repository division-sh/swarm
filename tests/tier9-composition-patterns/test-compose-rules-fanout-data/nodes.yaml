dispatcher:
  id: dispatcher
  execution_type: system_node
  subscribes_to: [batch.requested]
  produces: [batch.dispatched]
  event_handlers:
    batch.requested:
      count:
        items_from: payload.items
        store_as: entity.dispatch_count
      rules:
        - element_id: 3b904190-d776-4c26-8f6e-5ece29833581
          id: parallel
          condition: "payload.mode == 'parallel'"
          advances_to: dispatched
          emit:
            event: batch.dispatched
        - element_id: 3bda287d-e344-4302-aec4-9447c3e4e2ed
          id: sequential
          condition: "payload.mode == 'sequential'"
          data_accumulation:
            writes:
              - target_field: dispatch_count
                value: 1
          advances_to: dispatched
          emit:
            event: batch.dispatched
        - element_id: abee0baa-393d-4ffe-b2b5-65e857b2b36d
          id: fallback
          condition: "else"
          data_accumulation:
            writes:
              - target_field: dispatch_count
                value: 0
          advances_to: dispatched
          emit:
            event: batch.dispatched
