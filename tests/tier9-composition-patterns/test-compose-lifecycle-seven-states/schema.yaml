stages:
  created: {initial: true}
  setup: {}
  active: {}
  running: {}
  stable: {}
  winding_down: {}
  closed: {terminal: true}
pins:
  inputs:
    events: [phase.init, phase.activate, phase.start, phase.stabilize, phase.wind_down, phase.close]
  outputs:
    events:
      - event: lifecycle.complete
        sink: harness
