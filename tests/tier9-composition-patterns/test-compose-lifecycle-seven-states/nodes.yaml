lifecycle:
  phase.init:
    advances_to: setup
  phase.activate:
    guard: instance.stage == 'setup'
    advances_to: active
  phase.start:
    advances_to: running
  phase.stabilize:
    advances_to: stable
  phase.wind_down:
    advances_to: winding_down
  phase.close:
    guard: instance.stage == 'winding_down'
    advances_to: closed
    emit:
      event: lifecycle.complete
