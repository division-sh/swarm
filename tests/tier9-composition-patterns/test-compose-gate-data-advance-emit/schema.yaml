name: test-compose-gate-data-advance-emit
initial_state: stage_one
terminal_states: [complete]
states: [stage_one, stage_two, complete]
pins:
  inputs:
    events: [stage.one_done, stage.two_done]
  outputs:
    events:
      - name: stage.two_start
        event: stage.two_start
        sink: harness
      - name: stage.complete
        event: stage.complete
        sink: harness
