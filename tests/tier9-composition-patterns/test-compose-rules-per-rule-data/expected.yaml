trigger:
  event: conflict.submitted
  payload:
    strategy: keep_best
    value_a: low
    value_b: high
expected:

  handler_outcome: success
  entity_state: resolved
  emitted_events: [conflict.resolved]
  entity_fields:
    resolved_value: high
    resolution_method: best

conformance:
  disposition: runtime
  verify: pass
  proves:
    - catalog.runtime.composition_patterns
  public_companion:
    path: tests/visible-smoke.yaml
    proof_role: protocol-only
