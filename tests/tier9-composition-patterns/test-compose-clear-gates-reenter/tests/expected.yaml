trigger:
  sequence:
    - event: review.done
      payload: {}
    - event: review.insufficient
      barrier_before:
        kind: run_terminal
      error_contains: run is not active
      payload: {}
expected:

  handler_outcome: terminal_reject
  entity_state: approved
  emitted_events: [review.approved]
  gates:
    g_reviewed: true

conformance:
  disposition: runtime
  verify: pass
  proves:
    - catalog.runtime.composition_patterns
  public_companion:
    path: tests/visible-smoke.yaml
    proof_role: protocol-only
