name: test-compose-create-instance-config
initial_state: idle
terminal_states: [spawned]
states: [idle, spawned]
pins:
  inputs:
    events: [spawn.requested, task.assign]
  outputs:
    events:
      - spawn.done
      - task.assign
connect:
  - event: spawn.done
    from: .
    to: worker
  - event: task.assign
    from: .
    to: worker
