name: test-compose-create-instance-config
stages:
  idle: {initial: true}
  spawned: {terminal: true}
pins:
  inputs:
    - spawn.requested
    - task.assign
  outputs:
    - spawn.done
    - task.assign
connect:
  - event: spawn.done
    from: .
    to: worker
    resolution: create
  - event: task.assign
    from: .
    to: worker
    resolution: select
