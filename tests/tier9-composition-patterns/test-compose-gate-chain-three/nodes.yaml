pipeline:
  gate_state:
    g_a: first gate in the release chain
    g_b: second gate in the release chain
    g_c: third gate in the release chain
  step.a_done:
    sets_gate: g_a
    advances_to: stage_a
  step.b_done:
    guard: state.g_a == true
    sets_gate: g_b
    advances_to: stage_b
  step.c_done:
    guard: state.g_b == true
    sets_gate: g_c
    advances_to: released
    emit:
      event: release.ready
