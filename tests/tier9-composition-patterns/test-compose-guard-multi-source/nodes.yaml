gatekeeper:
  execution_type: system_node
  subscribes_to: [candidate.submitted]
  produces: [candidate.accepted]
  event_handlers:
    candidate.submitted:
      guard:
        checks:
          - id: depth_check
            check: has(state.depth) && state.depth <= policy.max_depth
          - id: count_check
            check: has(state.child_count) && state.child_count < 2
          - id: score_floor
            check: payload.score >= policy.min_score
          - id: no_flags
            check: has(state.flag_count) && state.flag_count == 0
          - id: name_unique
            check: query_entities(name == payload.name).count == 0
        on_fail: discard
      advances_to: accepted
      emit:
        event: candidate.accepted
