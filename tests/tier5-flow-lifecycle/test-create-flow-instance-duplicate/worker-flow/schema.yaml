name: worker-flow
mode: template
instance: worker_id
stages:
  idle: {initial: true}
  awaiting_ready: {}
  awaiting_spawned: {}
  complete: {terminal: true}
auto_emit_on_create:
  event: worker.ready
pins:
  inputs:
    events:
      - event: flow.spawned
        resolution: {mode: create}
  outputs:
    events: [worker.ready]
