test-node:
  execution_type: system_node
  subscribes_to: [flow.spawn_requested, flow.finished]
  produces: [flow.spawned]
  event_handlers:
    flow.spawn_requested:
      advances_to: spawned
      emit:
        event: flow.spawned
        fields:
          worker_id: ${payload.worker_id}
    flow.finished:
      advances_to: done
