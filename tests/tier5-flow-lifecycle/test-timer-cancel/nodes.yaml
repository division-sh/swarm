timer-node:
  timers:
    - id: check_timer
      event: timer.check
      delay: 1h
      start_on: event:timer.scheduled
      cancel_on: event:timer.cancel_requested
  timer.scheduled:
    advances_to: waiting
  timer.check:
    advances_to: done

cancel-node:
  timer.cancel_requested:
    advances_to: cancelled
    emit:
      event: timer.cancelled
