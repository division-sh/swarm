trigger:
  sequence:
    - event: task.completed
      payload:
    - event: task.updated
      barrier_before:
        kind: run_terminal
      error_contains: run is not active
      payload:
        data: late-update

expected:

  handler_outcome: terminal_reject
  entity_state: done
  emitted_events: [task.finished]

conformance:
  disposition: runtime
  verify: pass
  proves:
    - catalog.runtime.flow_lifecycle
  public_companion:
    path: tests/visible-smoke.yaml
    proof_role: protocol-only
