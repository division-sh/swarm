test-node:
  id: test-node
  execution_type: system_node
  subscribes_to: [monitor.started, monitor.stopped, timer.tick]
  timers:
    - id: tick_timer
      event: timer.tick
      delay: 10s
      start_on: event:monitor.started
      cancel_on: event:monitor.stopped
      recurring: true
  event_handlers:
    monitor.started:
      advances_to: monitoring
    monitor.stopped:
      advances_to: done
    timer.tick:
      advances_to: monitoring
