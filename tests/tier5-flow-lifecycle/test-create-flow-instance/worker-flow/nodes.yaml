worker-node:
  execution_type: system_node
  subscribes_to: [worker.observed, flow.spawned]
  # The agent's observed event may arrive before the creating node delivery.
  event_handlers:
    flow.spawned:
      guard:
        check: payload.worker_id != ''
      rules:
        - when: _entity.current_state == 'awaiting_spawned'
          advances_to: complete
        - else: true
          advances_to: awaiting_observed
    worker.observed:
      rules:
        - when: _entity.current_state == 'awaiting_observed'
          advances_to: complete
        - else: true
          advances_to: awaiting_spawned
