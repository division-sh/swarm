worker-node:
  flow.spawned:
    guard: payload.worker_id != ''
    rules:
      - when: instance.stage == 'awaiting_spawned'
        advances_to: complete
      - advances_to: awaiting_observed
  worker.observed:
    rules:
      - when: instance.stage == 'awaiting_observed'
        advances_to: complete
      - advances_to: awaiting_spawned
