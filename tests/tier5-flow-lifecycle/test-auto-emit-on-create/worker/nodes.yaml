worker:
  execution_type: system_node
  subscribes_to: [auto.started, worker.requested]
  produces: [auto.processed]
  event_handlers:
    worker.requested:
      guard:
        check: payload.instance_id != ''
      rules:
        - when: _entity.current_state == 'awaiting_requested'
          advances_to: done
        - when: _entity.current_state == 'started'
          advances_to: requested_started
        - else: true
          advances_to: requested
    auto.started:
      rules:
        - when: _entity.current_state == 'requested'
          advances_to: requested_started
          emit:
            event: auto.processed
        - else: true
          advances_to: started
          emit:
            event: auto.processed

observer:
  execution_type: system_node
  subscribes_to: [auto.processed]
  produces: []
  event_handlers:
    auto.processed:
      rules:
        - when: _entity.current_state == 'requested_started'
          advances_to: done
        - else: true
          advances_to: awaiting_requested
