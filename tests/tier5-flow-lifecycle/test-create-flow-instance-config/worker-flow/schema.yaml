name: worker-flow
instance: worker_id
stages:
  idle: {}
  awaiting_ready: {}
  awaiting_spawned: {}
  complete: {final: true}
instance_variables:
  variables:
    max_retries: integer
    timeout_ms: integer
auto_emit_on_create:
  event: worker.ready
pins:
  inputs:
    - event: flow.spawned
      initialize:
        max_retries: payload.config.max_retries
        timeout_ms: payload.config.timeout_ms
  outputs:
    - worker.ready
