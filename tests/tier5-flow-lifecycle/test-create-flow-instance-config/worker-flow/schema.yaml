name: worker-flow
instance: worker_id
stages:
  idle: {initial: true}
  awaiting_ready: {}
  awaiting_spawned: {}
  complete: {terminal: true}
instance_variables:
  variables:
    max_retries: integer
    timeout_ms: integer
auto_emit_on_create:
  event: worker.ready
pins:
  inputs:
    events:
      - event: flow.spawned
        initialize:
          max_retries: payload.config.max_retries
          timeout_ms: payload.config.timeout_ms
  outputs:
    events: [worker.ready]
