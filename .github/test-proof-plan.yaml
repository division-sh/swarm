units:
  catalog-required-inventory:
    packages:
      - github.com/division-sh/swarm/internal/testcatalog
    run: ^TestCatalog(RequiredInventory|InventoryFailsClosed|ExternalProofsFailClosed|ExternalProofPartitionsThroughInventory|OwnershipHasNoLegacyClassifierOrSimulator|FixturesUseCanonicalCreateFlowInstanceAuthoring|RequiredCIProofSelection|RequiredCensusArtifacts)$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  catalog-required-verify:
    packages:
      - github.com/division-sh/swarm/internal/cliapp
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  catalog-required-smoke:
    packages:
      - github.com/division-sh/swarm/internal/runtime/cataloge2e
    run: ^TestCatalogRequiredSmoke$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  catalog-full:
    packages:
      - github.com/division-sh/swarm/internal/runtime/cataloge2e
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  catalog-replay-1:
    packages:
      - github.com/division-sh/swarm/internal/runtime/cataloge2e
    run: '^TestC.*[^23]$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  catalog-replay-2:
    packages:
      - github.com/division-sh/swarm/internal/runtime/cataloge2e
    run: '^TestCatalogReplayClean_SelectedStores2$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  catalog-replay-3:
    packages:
      - github.com/division-sh/swarm/internal/runtime/cataloge2e
    run: '^TestCatalogReplayClean_SelectedStores3$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  catalog-runtime:
    packages:
      - github.com/division-sh/swarm/internal/runtime/cataloge2e
    run: '^(Test($|[^CS].*|Stage.*|SelectedForkFlowOwnedReadinessBothStoresInitial)|Example.*|Fuzz.*)$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  catalog-runtime-staged:
    packages:
      - github.com/division-sh/swarm/internal/runtime/cataloge2e
    run: '^TestSelectedForkFlowOwnedReadinessBothStoresStaged$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  hitl-llm-full:
    packages:
      - github.com/division-sh/swarm/internal/runtime/llm
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  hitl-releasee2e-rest:
    packages:
      - github.com/division-sh/swarm/internal/releasee2e
    run: '^(Test($|[^CDG].*)|Example.*|Fuzz.*)$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  hitl-releasee2e-burst-1:
    packages:
      - github.com/division-sh/swarm/internal/releasee2e
    run: '^TestGoldenAgentWorkloadBurstConcurrencyOnBothBackendsIteration1$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  hitl-releasee2e-burst-2:
    packages:
      - github.com/division-sh/swarm/internal/releasee2e
    run: '^TestGoldenAgentWorkloadBurstConcurrencyOnBothBackendsIteration2$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  hitl-releasee2e-golden:
    packages:
      - github.com/division-sh/swarm/internal/releasee2e
    run: '^TestGolden($|[^AI].*|AgentWorkload($|[^B].*))$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  hitl-releasee2e-journeys:
    packages:
      - github.com/division-sh/swarm/internal/releasee2e
    run: '^Test(C.*|GoldenI.*)$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  hitl-releasee2e-invocation-1:
    packages:
      - github.com/division-sh/swarm/internal/releasee2e
    run: '^TestDurableDataInvocationInvarianceSQLitePostgresShard1$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  hitl-releasee2e-invocation-2:
