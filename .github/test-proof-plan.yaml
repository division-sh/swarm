      TestDeploymentSourceChangedPinPublicForkAndLostResponse: [root/sqlite, root/postgres, singleton/sqlite, singleton/postgres]
      TestEventSourceChangedPinPublicForkAndLostResponse: [root/sqlite, root/postgres, singleton/sqlite, singleton/postgres]
      TestSelectedDeploymentExternalEffectRecoveryBothStores: [authorized/sqlite, authorized/postgres, response_observed/sqlite, response_observed/postgres, settled/sqlite, settled/postgres]
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
