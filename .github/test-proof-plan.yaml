units:
  local-catalog-smoke:
    packages: [github.com/division-sh/swarm/internal/runtime/cataloge2e]
    run: '^TestCatalogRequiredSmoke$'
    count_mode: count-1
    environment_id: local-postgres-gateway-empty-v1
    budget_class: full
  local-api-parity:
    packages: [github.com/division-sh/swarm/internal/apiv1]
    run: '^TestPublicSurfaceBackendMatrixCoversSelectedBackendRows$'
    count_mode: count-1
    environment_id: local-postgres-gateway-empty-v1
    budget_class: full
  local-release-golden-restart:
    packages: [github.com/division-sh/swarm/internal/releasee2e]
    run: '^TestGoldenAgentWorkloadRestartAndForcedKillOnBothBackends$'
    required_children:
      TestGoldenAgentWorkloadRestartAndForcedKillOnBothBackends: [sqlite, postgres]
    count_mode: count-1
    environment_id: local-postgres-gateway-empty-v1
    budget_class: full
  local-release-lifecycle-smoke:
    packages: [github.com/division-sh/swarm/internal/releasee2e]
    run: '^TestCompiledProcessFullLifecycleSQLiteSmoke$'
    count_mode: count-1
    environment_id: local-postgres-gateway-empty-v1
    budget_class: full
  local-serveapp-canaries:
    packages: [github.com/division-sh/swarm/internal/serveapp]
    run: '^(TestMockAgentSupportedSurfaceSQLitePostgres|TestServedResetRetainClearAndHistoricalReplayBothStores|TestSelectedForkPublicChangedTargetExecutionBothStores|TestIssue2394ServedStopTwentyBothStores)$'
    required_children:
      TestMockAgentSupportedSurfaceSQLitePostgres: [sqlite, postgres]
      TestServedResetRetainClearAndHistoricalReplayBothStores: [default_sqlite/clear=false, default_sqlite/clear=true, explicit_postgres/clear=false, explicit_postgres/clear=true]
      TestSelectedForkPublicChangedTargetExecutionBothStores: [default_sqlite, explicit_postgres]
      TestIssue2394ServedStopTwentyBothStores: [default_sqlite, explicit_postgres]
    count_mode: count-1
    environment_id: local-postgres-gateway-empty-v1
    budget_class: full
  parity-served-source-artifact:
    packages: [github.com/division-sh/swarm/internal/serveapp]
    run: '^TestInternalLifecycleScenarioConsumesAdmittedSourceAcrossSupportedBackendsAndModes$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  parity-connected-channel-onboarding-surface:
    packages: [github.com/division-sh/swarm/internal/serveapp]
    run: '^TestChannelConnectTelegramFirstUserJourney$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  parity-destructive-reset-crash:
    packages: [github.com/division-sh/swarm/internal/serveapp]
    run: '^TestResetProcessDeathRecoversBeforeSourceAdmissionBothStores$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  parity-golden-forced-restart:
    packages: [github.com/division-sh/swarm/internal/releasee2e]
    run: '^TestGoldenAgentWorkloadRestartAndForcedKillOnBothBackends$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  # CI34349231066: TestF*/TestH* total 69s; the complement totals 56s.
  conformance-1:
    packages:
      - github.com/division-sh/swarm/internal/runtime/conformance
    run: '^Test[FH].*$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  conformance-2:
    packages:
      - github.com/division-sh/swarm/internal/runtime/conformance
    run: '^(Test($|[^FHI].*|I($|[^s].*|s($|[^s].*|s($|[^u].*|u($|[^e].*|e($|[^2].*|2($|[^3].*|3($|[^9].*|9($|[^4].*)))))))))|Example.*|Fuzz.*)$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  # Issue2394: the original aggregate exhausted240s with37 passing roots.
  # Preserve whole roots:133 =113 general +14 core +5 pressure +1 reporter.
  # Reservation controls alone take80s; delayed500 keeps its own240s envelope.
  conformance-2394-core:
    packages:
      - github.com/division-sh/swarm/internal/runtime/conformance
    run: '^TestIssue2394(D3.*|Nested.*|Supplemental(Contention|Soak).*|TwentyIntent.*|TwoTen.*)$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  conformance-2394-pressure:
    packages:
      - github.com/division-sh/swarm/internal/runtime/conformance
    run: '^TestIssue2394(Pressure.*|SupplementalPressure.*|TwentyTwoIntentPressure.*)$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  conformance-2394-reporter:
    packages:
      - github.com/division-sh/swarm/internal/runtime/conformance
    run: '^TestIssue2394ReporterFiveHundredDelayedCommitsBothStores$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  # Lead approval: issue #2394 comment 5743323725. These are mandatory in every
  # profile, not nightly substitutes. Each isolated cell executes both the full
  # 900s pressure window and exact final drain/readback with original assertions.
  # Go 22m = 900s window + 90s drain + 330s setup/readback/cleanup allowance.
  # Command 25m adds 180s compilation/provisioning; job 30m adds 300s checkout,
  # cache and evidence handling. Ordinary 240s/540s budgets remain unchanged.
  conformance-soak-sqlite:
    packages:
      - github.com/division-sh/swarm/internal/runtime/conformance
    run: '^TestIssue2394TwentyTwoIntentFifteenMinuteSoakBothStores$/^sqlite$'
    go_timeout: 22m
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: soak
  conformance-soak-postgres:
    packages:
      - github.com/division-sh/swarm/internal/runtime/conformance
    run: '^TestIssue2394TwentyTwoIntentFifteenMinuteSoakBothStores$/^postgres$'
    go_timeout: 22m
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: soak
  # Full-profile CI34347597064: TestO* takes 77s; other API proofs take 46s.
  # Keep whole top-level proofs, including their backend and negative-case rows.
  api-operator:
    packages:
      - github.com/division-sh/swarm/internal/apiv1
    run: '^TestO.*$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  api-rest:
    packages:
      - github.com/division-sh/swarm/internal/apiv1
    run: '^(Test($|[^O].*)|Example.*|Fuzz.*)$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  catalog-required-inventory:
    packages:
      - github.com/division-sh/swarm/internal/testcatalog
    run: ^TestCatalog(RequiredInventory|InventoryFailsClosed|ExternalProofsFailClosed|ExternalProofPartitionsThroughInventory|OwnershipHasNoLegacyClassifierOrSimulator|FixturesUseCanonicalCreateFlowInstanceAuthoring|RequiredCIProofSelection|RequiredCensusArtifacts)$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  catalog-required-verify:
    packages:
      - github.com/division-sh/swarm/internal/cliapp
