version: 1
module: github.com/division-sh/swarm
planning:
  target_seconds: 240
  max_shards: 12
  unknown_package_seconds: 30
escalation_paths:
  - ^internal/runtime/
  - ^internal/testcatalog/
  - ^internal/cliapp/catalog_conformance_test\.go$
  - ^internal/cliapp/test_command_test\.go$
  - ^tests/
  - ^platform-spec\.yaml$
  - ^\.github/workflows/
  - ^\.github/test-
  - ^internal/testutil/
  - ^internal/testplanning/
  - ^internal/testtiming/
  - ^cmd/swarm-test-timing/
special_packages:
  - github.com/division-sh/swarm/internal/cliapp
  - github.com/division-sh/swarm/internal/runtime/cataloge2e
  - github.com/division-sh/swarm/internal/runtime
  - github.com/division-sh/swarm/internal/serveapp
  - github.com/division-sh/swarm/internal/store
  - github.com/division-sh/swarm/internal/testcatalog
  - github.com/division-sh/swarm/internal/testpostgres
  - github.com/division-sh/swarm/internal/store/internal/runtimepersistence
profiles:
  pr-common:
    count_mode: cache-default
    environment_id: ci-postgres-gateway-empty-v1
    units:
      - catalog-required-inventory
      - catalog-required-verify
      - catalog-required-smoke
      - runtime-full
      - serveapp-full
      - store-full
      - store-runtime-full-01
      - store-runtime-full-02
      - store-runtime-full-03
      - store-runtime-full-04
      - testpostgres-full
  pr-escalated:
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    units:
      - catalog-required-inventory
      - catalog-required-verify
      - catalog-full
      - runtime-full
      - serveapp-full
      - store-full
      - store-runtime-full-01
      - store-runtime-full-02
      - store-runtime-full-03
      - store-runtime-full-04
      - testpostgres-full
  full:
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    units:
      - catalog-required-inventory
      - catalog-required-verify
      - catalog-full
      - runtime-full
      - serveapp-full
      - store-full
      - store-runtime-full-01
      - store-runtime-full-02
      - store-runtime-full-03
      - store-runtime-full-04
      - testpostgres-full
  nightly:
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    units:
      - catalog-required-inventory
      - catalog-required-verify
      - catalog-full
      - runtime-full
      - serveapp-full
      - store-full
      - store-runtime-full-01
      - store-runtime-full-02
      - store-runtime-full-03
      - store-runtime-full-04
      - testpostgres-full
units:
  catalog-required-inventory:
    packages:
      - github.com/division-sh/swarm/internal/testcatalog
    run: ^TestCatalog(RequiredInventory|InventoryFailsClosed|ExternalProofsFailClosed|OwnershipHasNoLegacyClassifierOrSimulator|FixturesUseCanonicalCreateFlowInstanceAuthoring|RequiredCIProofSelection|RequiredCensusArtifacts)$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  catalog-required-verify:
    packages:
      - github.com/division-sh/swarm/internal/cliapp
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  catalog-required-smoke:
    packages:
      - github.com/division-sh/swarm/internal/runtime/cataloge2e
    run: ^TestCatalogRequiredSmoke$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  catalog-full:
    packages:
      - github.com/division-sh/swarm/internal/runtime/cataloge2e
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  runtime-full:
    packages:
      - github.com/division-sh/swarm/internal/runtime
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  serveapp-full:
    packages:
      - github.com/division-sh/swarm/internal/serveapp
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  store-full:
    packages:
      - github.com/division-sh/swarm/internal/store
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  store-runtime-full-01:
    packages:
      - github.com/division-sh/swarm/internal/store/internal/runtimepersistence
    run: ^(Test[A-E].*|Example.*|Fuzz.*)$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  store-runtime-full-02:
    packages:
      - github.com/division-sh/swarm/internal/store/internal/runtimepersistence
    run: ^Test[F-O].*$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  store-runtime-full-03:
    packages:
      - github.com/division-sh/swarm/internal/store/internal/runtimepersistence
    run: ^Test[P-Q].*$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  store-runtime-full-04:
    packages:
      - github.com/division-sh/swarm/internal/store/internal/runtimepersistence
    run: ^Test[R-Z].*$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  testpostgres-full:
    packages:
      - github.com/division-sh/swarm/internal/testpostgres
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  selected-store-fast:
    packages:
      - github.com/division-sh/swarm/internal/store
      - github.com/division-sh/swarm/internal/serveapp
      - github.com/division-sh/swarm/internal/apiv1
    run: TestSelectedStoreAbstractionGuardMatrix|TestSelectedStoreFacadeOwnsProducerBackendBranching|TestSelectedStoreFacadeBackendBranchingGuardRejectsProducerFixture|TestSelectedSQLiteRuntimeWriterBoundaryAudit|TestRuntimeWriterBoundaryGuardRejects|TestSelectedSQLiteRuntimeConstructionConsumesMutationBoundary|TestPublicSurfaceBackendMatrixCoversSelectedBackendRows|TestPublicSurfaceBackendMatrixRejectsStaleReferences
    count_mode: count-1
    environment_id: local-postgres-explicit-v1
    budget_class: broad
projections:
  required-full:
    profile: full
  catalog-full:
    unit: catalog-full
  selected-store-fast:
    unit: selected-store-fast
