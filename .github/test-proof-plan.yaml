      - github.com/division-sh/swarm/internal/releasee2e
    run: '^TestDurableDataInvocationInvarianceSQLitePostgresShard2$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  hitl-releasee2e-invocation-3:
    packages:
      - github.com/division-sh/swarm/internal/releasee2e
    run: '^TestDurableDataInvocationInvarianceSQLitePostgresShard3$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  hitl-releasee2e-invocation-4:
    packages:
      - github.com/division-sh/swarm/internal/releasee2e
    run: '^TestDurableDataInvocationInvarianceSQLitePostgresShard4$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  hitl-releasee2e-invocation-5:
    packages:
      - github.com/division-sh/swarm/internal/releasee2e
    run: '^TestDurableDataInvocationInvarianceSQLitePostgresShard5$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  hitl-releasee2e-invocation-6:
    packages:
      - github.com/division-sh/swarm/internal/releasee2e
    run: '^TestDurableDataInvocationInvarianceSQLitePostgresShard6$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  runtime-full:
    packages:
      - github.com/division-sh/swarm/internal/runtime
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  serveapp-channel:
    packages:
      - github.com/division-sh/swarm/internal/serveapp
    # 34287939711: move the independent 53.10s reset and 46.06s rotation
    # journeys to existing lighter units; no backend/case split or extra job.
    run: '^Test(Canonical.*|Channel(Connect.*|Effect.*|Listener.*|Onboarding(Admitted.*|Early.*|E2E.*|Crash.*))|Claude.*|CLI_.*|Configure.*|Connected.*|Create.*)$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  serveapp-runtime:
    packages:
      - github.com/division-sh/swarm/internal/serveapp
    # RE2 complement of TestReceiver; the adjacent unit owns that family.
    run: '^TestR($|[^e].*|e($|[^c].*|c($|[^e].*|e($|[^i].*|i($|[^v].*|v($|[^e].*|e($|[^r].*)))))))$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  serveapp-receivers:
    packages:
      - github.com/division-sh/swarm/internal/serveapp
    run: '^TestReceiver.*$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  contracts-first:
    packages:
      - github.com/division-sh/swarm/internal/runtime/contracts
    run: '^(Test($|[^M-Z].*)|Example.*|Fuzz.*)$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  contracts-rest:
    packages:
      - github.com/division-sh/swarm/internal/runtime/contracts
    run: '^Test[M-Z].*$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  serveapp-surfaces:
    packages:
      - github.com/division-sh/swarm/internal/serveapp
    run: '^TestSe.*$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  serveapp-other:
    packages:
      - github.com/division-sh/swarm/internal/serveapp
    run: '^(Test($|[^CR-Z].*)|TestChannelOnboardingPendingResetRestartToReadyE2E|Example.*|Fuzz.*)$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  serveapp-standing:
    packages:
      - github.com/division-sh/swarm/internal/serveapp
    run: '^Test(S($|[^e].*)|[T-Z].*|ChannelOnboardingConfirmedChildRotationResumeE2E)$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  store-full:
    packages:
      - github.com/division-sh/swarm/internal/store
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  store-runtime-full-01:
    packages:
      - github.com/division-sh/swarm/internal/store/internal/runtimepersistence
    run: ^(Test($|[^D-Z].*)|Example.*|Fuzz.*)$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  store-runtime-full-02:
    packages:
      - github.com/division-sh/swarm/internal/store/internal/runtimepersistence
    run: ^Test[D-F].*$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  store-runtime-full-03:
    packages:
      - github.com/division-sh/swarm/internal/store/internal/runtimepersistence
    run: ^Test[G-O].*$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  store-runtime-full-04:
    packages:
      - github.com/division-sh/swarm/internal/store/internal/runtimepersistence
    run: ^Test[P-Q].*$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  store-runtime-full-05:
    packages:
      - github.com/division-sh/swarm/internal/store/internal/runtimepersistence
    run: ^TestR.*$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  store-runtime-full-06:
    packages:
      - github.com/division-sh/swarm/internal/store/internal/runtimepersistence
    run: ^Test[S-Z].*$
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  testpostgres-full:
    packages:
      - github.com/division-sh/swarm/internal/testpostgres
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  selected-store-fast:
    packages:
      - github.com/division-sh/swarm/internal/store
      - github.com/division-sh/swarm/internal/store/selected
      - github.com/division-sh/swarm/internal/serveapp
      - github.com/division-sh/swarm/internal/apiv1
    run: TestSelectedStoreAbstractionGuardMatrix|TestProductionSelectedStoreBoundaryIsClosed|TestProductionSelectedStoreBoundaryGuardRejectsOldInterpreters|TestSelectedSQLiteRuntimeWriterBoundaryAudit|TestRuntimeWriterBoundaryGuardRejects|TestSelectedSQLiteRuntimeConstructionConsumesMutationBoundary|TestPublicSurfaceBackendMatrixCoversSelectedBackendRows|TestPublicSurfaceBackendMatrixRejectsStaleReferences
