    run: '^TestGoldenAgentWorkloadRestartAndForcedKillOnBothBackends$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  # Keep the production-size fan-out journeys intact under a full-proof budget.
  # CI36197772222: these two roots took 149s and 106s; the remaining shard
  # took about 147s, but their combined 402s exceeded the broad 240s budget.
  conformance-1:
    packages:
      - github.com/division-sh/swarm/internal/runtime/conformance
    run: '^Test[FH].*$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: broad
  conformance-heavy-fanout:
    packages:
      - github.com/division-sh/swarm/internal/runtime/conformance
    run: '^TestVolumeFanOut(ExactJobflow1362ImportRouteAndSettleBothStores|ServingCardinalityMixedOutputPartitionEquivalenceBothStores)$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
    budget_class: full
  conformance-2:
    packages:
      - github.com/division-sh/swarm/internal/runtime/conformance
    run: '^(Test($|[^FHIV].*|I($|[^s].*|s($|[^s].*|s($|[^u].*|u($|[^e].*|e($|[^2].*|2($|[^3].*|3($|[^9].*|9($|[^4].*)))))))))|Example.*|Fuzz.*)$'
