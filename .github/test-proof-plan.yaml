    packages: [github.com/division-sh/swarm/internal/releasee2e]
    run: '^Test(GoldenAgentWorkloadRestartAndForcedKillOnBothBackends|PayloadlessEventPublicPersistenceJourneyBothStores)$'
    required_children:
      TestGoldenAgentWorkloadRestartAndForcedKillOnBothBackends: [sqlite, postgres]
      TestPayloadlessEventPublicPersistenceJourneyBothStores: [sqlite, postgres]
    count_mode: count-1
    environment_id: local-postgres-gateway-empty-v1
    budget_class: full
  local-release-lifecycle-smoke:
    packages: [github.com/division-sh/swarm/internal/releasee2e]
    run: '^TestCompiledProcessFullLifecycleSQLiteSmoke$'
    count_mode: count-1
    environment_id: local-postgres-gateway-empty-v1
