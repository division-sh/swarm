  catalog-runtime:
    packages:
      - github.com/division-sh/swarm/internal/runtime/cataloge2e
    run: '^(Test($|[^CS].*|Stage.*|ScatterGatherSafetyBothStores|ScatterGatherFrontierAggregatePreservesRefusalsBothStores|SelectedDownstreamPreparationFailsBeforeMaterializationBothStores|SelectedForkRecoveredReceiverReadinessBothStores|SelectedForkFlowOwnedReadinessBothStoresInitial|SelectedContractActivationAllowsCausalForkLocalRuntimeLogDiagnostic|SelectedForkPendingRootAgentInputBothStores)|Example.*|Fuzz.*)$'
    count_mode: count-1
    environment_id: ci-postgres-gateway-empty-v1
