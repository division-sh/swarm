    proof: >-
      ValidateManagedProviderPreflight uses the disjoint startup-probe authority,
      excludes emit tools, joins every optional empty-object tool probe before
      returning, and cannot admit managed execution or release EventBus delivery.
      It may persist provider capability/effect evidence, but it is not an
      autonomous retained-work producer and does not consume dynamic process
      topology.
  current_source_completed_active_dynamic_readiness:
    classification: prerequisite_consumer_safe_before_topology
    proof: source_scoped_completed_eligible_plan_is_durable_desired_topology_not_interrupted_work
  current_source_ordinary_pending_dynamic_readiness:
    classification: startup_blocking_when_replay_disabled
    proof: authorized_items_prepare_process_topology_for_the_complete_set_before_any_keyed_finalizer_can_arm_or_publish
  predecessor_completed_source_transition:
    classification: state_or_authority_only_safe_before_topology
    proof: current_run_source_authorizes_one_atomic_batch_plan_replacement_before_Manager_Run_but_no_process_or_event_work
  predecessor_pending_source_transition:
    classification: source_canonicalization_and_resume_are_recovery_gated
    proof: predecessor_incomplete_posture_cannot_be_erased_by_source_rebind
  generation_owned_automatic_readiness_retry:
    classification: exact_source_scoped_current_pending_consumer
    replacement: InspectDynamicFlowRuntimeReadinessForSource
    proof: >-
      The manager-owned immutable BundleSourceFact selects rows in SQL before decode;
      the existing generation-owned loop retries only current ordinary pending rows
      for its own source on both explicit signal and bounded periodic wakeup. The
      periodic path uses the same loop, lease, projection, and keyed reconciler; it is
      not a second scheduler or owner. Source transitions retain their separate
      authorization and foreign rows are invisible.
  manager_recovery_diagnostic_and_admission_snapshot:
    classification: exact_source_scoped_observation_only_consumer
    replacement: InspectDynamicFlowRuntimeReadinessForSource
    proof: >-
      The snapshot counts current ordinary pending plus predecessor-pending transition
      work for only the manager-owned source and performs no readiness mutation.
  live_standing_source_revision:
    classification: exact_run_and_current_source_scoped_derivation_consumer
    replacement: InspectDynamicFlowRuntimeReadinessForRun
    proof: >-
      The selected store constrains exact run_id and current BundleSourceFact in SQL
      before decode; current semantic authority derives the complete desired set and
      passes it once to the guarded batch writer. One row remains a batch of one.
  persisted_dynamic_route_without_readiness:
    classification: invalid_obsolete_and_deleted
    proof: source_scoped_current_activation_commits_readiness_and_exact_route_topology_together
  pending_process_only_preparation:
    classification: prerequisite_consumer_safe_before_topology
    proof: reconciles_agents_generation_routes_and_flow_routes_for_all_authorized_rows_without_timer_arm_completion_or_event_publication
  pending_keyed_finalization:
    classification: autonomous_publication_or_execution_moved_after_topology
    proof: timer_arming_and_creation_publication_wait_until_every_completed_and_pending_sibling_process_receiver_is_verified
  selected_contract_route_recovery_evidence:
