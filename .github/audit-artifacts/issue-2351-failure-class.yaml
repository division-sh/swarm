    proof: optional_HydrateForStartup_mutates_recovered_tail_state_only_after_the_latch
  budget_projection:
    classification: autonomous_publication_or_execution_moved_after_topology
    proof: ProjectRecoveryBudgetState_can_publish_threshold_events_and_whole_optional_hydration_moves_after_the_latch
  lifecycle_diagnostic_projection:
