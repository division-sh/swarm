tracker:
  tracker_state_decision: current_issue_updated_before_coding
  watchlist_repository: swarm-docs
  watchlist_node: shutdown_and_runtime_lifecycle
  watchlist_decision: refine_existing_node_before_gate
  parent_action: keep_bounded_child_and_attach_architecture_to_2250
  parent_sibling_probe:
    static_topology: different_concept_already_unconditional
    selected_contract_recovery: different_recovery_evidence_concept
    delivery_continuations: different_owner_with_ordering_dependency
    terminal_singleton_materialization: split_to_2339
    broad_startup_phase_decomposition: remains_2250
  post_pre_audit_parent_action: close_corrected_child_now_keep_architecture_parent_open
  watchlist_promotion_check: >-
    The node already tracks split lifecycle/startup ownership and #2250 tracks broader
    readiness orchestration. Multi-bundle serving, cold source transition, automatic
    retry, live source revision, and recovery diagnostics are live consumers of the
    same readiness observation concept and are absorbed here through one source-
    scoped three-class projection, one exact-run derivative, and the existing writer
    evolved with an observed-state guard; no broader recovery family must be absorbed.
  remaining_parent_tail:
    grouping: wholesale_Runtime_Start_typed_phase_decomposition_and_general_recovery_scoping
    owner: 2250
    estimate: multi_pr_architecture_work
    confidence: high
  architecture_smell: >-
    HydrateForStartup combines mandatory process reconstruction with optional durable
    work replay, while standing source persistence advances the canonical run source
    before the runtime-owned derived readiness plan is canonicalized after startup.
    The persistence port also exposed a global collection reader to context-bound
    managers and accepted desired replacement without an observed-state coordinate.
  long_run_direction: explicit_typed_startup_phases_under_issue_2250
  architecture_tracking_decision: update_existing_issue_2250_and_watchlist_only
  architecture_effort: medium_to_large
  architecture_roi: high_but_not_required_for_this_bounded_fix
  new_issue_required: false

