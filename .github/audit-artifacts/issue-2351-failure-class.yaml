    broad_startup_phase_decomposition: remains_2250
  post_pre_audit_parent_action: close_corrected_child_now_keep_architecture_parent_open
  watchlist_promotion_check: >-
    The node already tracks split lifecycle/startup ownership and #2250 tracks broader
    readiness orchestration. Multi-bundle serving, cold source transition, automatic
    retry, live source revision, and recovery diagnostics are live consumers of the
    same readiness observation concept and are absorbed here through one source-
    scoped three-class projection, one exact-run derivative, and the selected-store
    writer evolved into one observed-state batch transaction. The cycle-8 probe also
    found schedule/timer, maintenance, run-lifecycle, pending-finalizer, pipeline,
    continuation, and outbox producers sharing the topology-ordering dependency; all
    are now classified behind one completed process-topology latch. The existing retry
    loop retains its bounded periodic wakeup. No broader recovery family must be
    absorbed.
  remaining_parent_tail:
    grouping: wholesale_Runtime_Start_typed_phase_decomposition_and_general_recovery_scoping
    owner: 2250
    estimate: multi_pr_architecture_work
    confidence: high
  architecture_smell: >-
    Runtime.Start hides prerequisite consumers, topology reconstruction, optional
    replay, autonomous schedules/timers, maintenance, lifecycle execution, and public
    release inside one oversized sequence. Standing source persistence also advances
    canonical run source before runtime-owned derived readiness, and the prior store
    API made a multi-plan semantic transition through independent row transactions.
    The bounded repair establishes exact batch and order semantics; typed general
    startup phases remain architecture work in #2250.
  long_run_direction: explicit_typed_startup_phases_under_issue_2250
  architecture_tracking_decision: update_existing_issue_2250_and_watchlist_only
