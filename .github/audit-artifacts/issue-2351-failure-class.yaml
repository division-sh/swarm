route_producer_census:
  canonical_current_format_writer: >-
    EventBus flow-instance activation derives RouteTopology from the same
    FlowInstanceActivationPlan that contains DynamicFlowRuntimeReadinessPlan, and the
    selected-store activation mutation commits them atomically.
  standalone_upsert_production_callers: zero
  exact_set_replace_production_callers:
    - selected_flow_instance_activation_mutation
    - readiness_owned_source_revision_and_retirement_mutations
  generic_no_readiness_restorer: restoreFlowInstanceRoutes
  disposition: delete_as_obsolete_fallback
  selected_contract_restorer: restoreSelectedContractRouteRecoveries
  selected_contract_disposition: retain_recovery_gated_as_different_concept
  source_scoped_invalid_route_detection: >-
    The startup projection attributes each active materialized template route to its
    active flow instance and run, constrains the run by exact BundleSourceFact in SQL,
    and requires an exact readiness row for that source. Static materialized routes
    are not dynamic-readiness-owned. It never lists all routes and never lets one
    context publish or reject another context's route.

