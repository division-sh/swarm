class_model:
  issue_category: p1_runtime_lifecycle_semantic_drift_and_supported_store_parity
  observed_symptom: >-
    On default recovery-disabled graceful restart, a completed active dynamic-flow
    readiness row and its route remain durable, but no executable dynamic process
    topology is reconstructed. The next normalized M5 event commits with no entity,
    recipient, delivery, or dead letter while the run is publicly running.
  exact_concepts:
    - exact_bundle_source_scoped_active_dynamic_executable_topology_reconstruction
    - exact_source_transition_readiness_plan_canonicalization
    - predecessor_readiness_completion_posture_preservation
    - exact_source_scoped_readiness_observation_for_startup_retry_and_recovery_diagnostics
    - exact_run_and_source_scoped_readiness_observation_for_live_source_revision
    - selected_store_atomic_batch_observed_state_guarded_readiness_plan_replacement
    - generation_owned_signal_and_periodic_retry_reachability
    - all_source_transition_plans_committed_or_rolled_back_as_one_set
    - all_authorized_pending_process_topology_prepared_before_any_finalizer_publication
    - completed_process_topology_latch_before_every_autonomous_startup_work_producer
    - managed_execution_authority_admission_separated_from_recovery_execution
    - optional_interrupted_execution_and_effect_replay
    - startup_refusal_for_incomplete_dynamic_readiness_without_replay_authority
    - current_manager_occurrence_agent_and_route_runnability
    - multi_context_startup_isolation_and_all_or_nothing_admission
  working_failure_class: source_and_run_scoped_dynamic_readiness_batch_canonicalization_topology_latching_and_autonomous_startup_producer_ordering
  immediate_parent_failure_class: startup_topology_reconstruction_and_execution_replay_policy_coupling
  parent_failure_class: multi_phase_runtime_startup_readiness_and_lifecycle_ownership
  architecture_parent_issue: 2250
  broader_failure_class: context_bound_readiness_consumers_share_global_observation_and_non_atomic_desired_state_replacement_while_startup_releases_autonomous_work_before_executable_topology
  framing: broad_enough_after_gate_cycle_9_complete_producer_census_and_atomic_transition_set_absorption
  prior_framing: too_narrow_and_superseded
  entry_point_not_boundary: >-
    The skip at Runtime.Start and registered/stopped adoption are entry points. The
    audit boundary includes every startup consumer in HydrateForStartup, every
    current-format route/readiness producer, automatic retry, live source revision,
    recovery diagnostics, observed-state batch replacement, execution admission, both Manager run
    modes, process route publication, pending finalization, run-lifecycle execution,
    maintenance, schedule and timer restoration, pipeline recovery, continuation synchronization,
    managed-provider startup probing, outbox, listeners, ingress, public readiness,
    refusal, compensation, restart postures, single- and multi-context serving,
    exact source isolation, and both stores.
  intended_closure_level: chosen_working_failure_class_eliminated
  chosen_class_closure_commitment: true
  closure_feasible_in_one_pr: true
  local_adoption_only_fix_would_leave_same_concept_interpreter_live: true
  corrected_class_complete_fix_leaves_same_concept_interpreter_live: false_after_global_list_port_deletion_atomic_batch_guarded_replacement_complete_process_topology_latch_and_post_latch_producer_release

governing_policy:
  current_source_completed_active_readiness: >-
    Always reconstruct and prove the exact executable agent and flow-route process
    topology in every allowed serving generation, independently of replay policy.
  current_source_ordinary_pending_recovery_disabled: >-
    Refuse startup before public readiness without mutating readiness, agents, routes,
    timers, creation events, effects, drains, receipts, or deliveries.
  current_source_ordinary_pending_recovery_enabled: >-
    Existing recovery authority admits it into the keyed readiness owner. Its process
    topology is prepared with the complete authorized set; only after every receiver
    is verified may keyed finalization arm timers, publish creation, and complete it.
  source_transition_required: >-
    A SQL-selected owning run matches the requested current BundleSourceFact while an
    otherwise valid exact run/instance readiness plan carries a predecessor source.
    It is neither current completed nor ordinary pending and is never reconstructed.
  predecessor_completed_source_transition: >-
    Mandatory desired-source canonicalization runs before Manager.Run regardless of
    recovery policy. The current semantic source derives the exact current plan and
    the selected-store batch readiness writer owns the guarded all-or-none
    replacement; the predecessor plan supplies no agent, route, version, or creation
    authority. The completed predecessor posture authorizes only this startup attempt's
    exact post-batch pending item to proceed to process preparation and finalization.
  predecessor_pending_source_transition: >-
    Preserve its incomplete posture. Recovery-disabled startup refuses before any
    readiness mutation. Recovery-enabled startup may canonicalize and resume it
    through the same current-source owner and existing keyed reconciler.
  source_scoped_readiness_projection:
    operation: InspectDynamicFlowRuntimeReadinessForSource
    input: exact_immutable_BundleSourceFact
    selected_store_owner: dynamic_flow_runtime_readiness_persistence
    query_boundary: >-
      PostgreSQL and SQLite join readiness to flow_instances and runs and constrain
      canonical runs.bundle_hash plus runs.bundle_source in SQL. An unscoped list,
      followed by process-side filtering, is forbidden.
    consumers:
      - all_context_startup_preflight_and_runtime_revalidation
      - generation_owned_signal_and_periodic_automatic_pending_retry
      - manager_recovery_diagnostic_and_admission_snapshot
      - post_manager_completed_topology_reconstruction
    output:
      - current_source_completed_rows
      - current_source_ordinary_pending_rows
      - source_transition_required_rows_with_predecessor_completion_posture
    fail_closed_validation:
      - malformed_readiness_plan
      - wrong_or_disagreeing_run_or_instance_identity
      - version_or_execution_mode_invalidity
      - source_owned_active_template_materialized_route_without_exact_readiness
      - changed_between_observation_and_exact_item_write
    excluded_from_process_installation:
      - terminal_run_rows
      - inactive_or_terminated_instance_rows
      - rows_owned_by_another_bundle_source
    freshness: >-
      Observation-only all-context preflight is repeated for the current source
      before Manager.Run. Source-transition rows are canonicalized only by one guarded
      exact-source batch write, then the projection is reloaded and must contain no
      source transition before Manager.Run. It is reloaded again after Manager.Run;
      an earlier snapshot never becomes process-topology authority.
  exact_run_readiness_projection:
    operation: InspectDynamicFlowRuntimeReadinessForRun
    input:
      - exact_run_id
      - exact_immutable_BundleSourceFact
    selected_store_owner: dynamic_flow_runtime_readiness_persistence
    query_boundary: >-
      PostgreSQL and SQLite constrain readiness by exact readiness.run_id and the
      joined owning run's bundle_hash plus bundle_source before decoding any plan.
      ReconcileDynamicFlowRuntimeReadinessPlansForRun receives only those rows; it
      never enumerates all source rows or all eligible rows and then filters in Go.
    consumers:
      - live_EnsureStandingTargets_source_revision
      - exact_item_current_source_plan_derivation
  observed_state_guarded_plan_replacement:
    operation: ReconcileDynamicFlowRuntimeReadinessPlans
    request:
      - exact_nonempty_set_of_observed_readiness_records_for_one_source
      - exact_desired_current_source_plan_for_each_observation
      - exact_observed_at
    observed_coordinate:
      - normalized_plan_json
      - owning_run_bundle_hash_and_bundle_source
      - topology_ready_at_completion_posture
      - creation_event_emitted_at_posture
      - run_status_and_eligibility
      - instance_status_terminated_at_and_eligibility
    transaction_rule: >-
      The selected-store owner rejects duplicate identities and mixed requested
      sources, derives and validates the complete desired set before opening the
      transaction, and locks every exact run/instance row in deterministic identity
      order. It reloads and compares every observed coordinate above for every item
      before issuing the first update. Any stale item or validation error returns a
      typed conflict with zero mutation. Every changed row is then updated in that one
      selected-store transaction; any write failure rolls the complete set back.
      Unchanged and replaced are distinct per-item successful results. A reload after
      commit is a fence, not a substitute for the locked comparisons.
    consumers:
      - live_source_revision_as_batch_of_one_or_more_for_the_exact_run
      - predecessor_completed_source_transition_set
      - recovery_authorized_predecessor_pending_source_transition_set
  exact_source_transition_batch_owner: >-
    Extract current-source plan derivation from
    ReconcileDynamicFlowRuntimeReadinessPlansForRun and feed the complete authorized
    source-transition set returned by the scoped projection to the selected-store
    ReconcileDynamicFlowRuntimeReadinessPlans operation once. Live source revision
    receives observations from the exact run-and-source SQL projection and delegates
    to the same plural owner; a one-item request is a batch of one, not a retained
    singular writer. Never call or post-filter an unscoped readiness list. Existing
    emitted-creation immutability and exact identity/execution-mode checks remain fail
    closed.
  source_transition_desired_topology_work: >-
    Batch canonicalization changes only durable readiness plans and clears completion
    for changed plans. It does not install process topology, arm timers, emit creation
    events, or replay unrelated interrupted work. Predecessor-completed authorizes
    bounded desired-source process preparation and finalization in the same startup
    attempt; predecessor-pending requires recovery authority. After a committed batch
    followed by process failure, the rows are ordinary current-source pending and no
    later startup may infer predecessor-completed authorization.
  source_transition_set_ordering: >-
    Startup MUST derive and validate every authorized source-transition plan for the
    exact source before one selected-store batch compare-and-replace. A per-item
    transaction or replace-then-finalize loop is forbidden because failure can leave
    durable mixed predecessor/current plans and aggregate route/descriptor consumers
    can observe sibling predecessor plans. After commit, one fresh exact-source
    projection MUST contain no source-transition row before any process preparation.
    A crash or failure after batch commit but before finalization leaves every changed
    row current-source pending; recovery-disabled restart refuses and recovery-enabled
    restart resumes through the ordinary pending owner.
  pending_process_preparation_and_finalization: >-
    The existing keyed readiness owner is separated into two bounded operations, not
    two semantic owners. Its process-only preparation phase reconciles exact agents,
    current generation routes, and flow routes for every authorized current pending
    row without arming timers, marking readiness complete, or publishing creation
    events. Every current-completed row is reconstructed through the same lifecycle
    and route owners. Only after all completed and authorized pending process topology
    is prepared and verified may keyed finalization arm exact timers, mark readiness,
    and publish any still-unemitted deterministic creation event. This prevents one
    pending finalizer from publishing against a sibling receiver that has not yet
    been reconstructed.
  completed_process_topology_latch: >-
    Runtime.Start proves, from a fresh exact-source projection, that no transition or
    authorized pending row remains and that every eligible completed row has its exact
    current-occurrence agent loop, generation route, and flow route. This is an
    in-memory phase boundary over existing owners, not a new durable owner, table, or
    framework. No autonomous startup producer may run before it closes.
  managed_execution_recovery_ordering: >-
    Managed-execution admission first establishes the exact execution and delivery
    authorities without replaying pipeline work or starting the delivery-continuation
    coordinator. Startup then starts the Manager occurrence and reconstructs and
    prepares every authorized pending receiver, finalizes it only after all process
    receivers are live, and verifies every current-completed dynamic agent loop,
    generation route, and flow route. Only after the completed topology latch may
    recovery-enabled hydration and event-level pipeline recovery run. The already-
    bound continuation owner then starts and synchronizes its exact delivery scope.
    Recovery-disabled startup retains its pre-admission refusal. Authority admission,
    process preparation, finalization, recovery execution, and continuation execution
    are ordered phases, not new semantic owners or a generic framework.
  autonomous_startup_producer_release: >-
    Run-lifecycle candidate execution, pipeline maintenance, generic schedule
    restore/boot admission, and workflow timer restore are delayed until completed
    topology plus pipeline recovery plus delivery-continuation synchronization. Their
    registration or construction may occur earlier only when it cannot claim, publish,
    execute, or arm work. Outbox dispatch and platform.boot follow those releases;
    public ingress remains fail-closed until Runtime.Start succeeds.
  schedule_pipeline_fence_decision: >-
    No second pre-continuation pipeline-exhaustion sweep is required. Persisted
    pipeline recovery reaches exhaustion after topology and before the continuation
    owner starts. Schedule and timer restoration is deliberately later than
    continuation start/synchronization, so due callbacks publish only when both exact
    receivers and the live continuation consumer exist. A sweep racing asynchronous
    callbacks would not be an execution fence and is forbidden as false proof.
  replay_only_work: >-
    Effects, provider drains, budget and diagnostic recovery projection, pipeline
    receipts, delivery replay, ordinary pending timer/creation recovery, and selected-
    contract route recovery remain conditional on existing recovery authority.
  invalid_route_without_readiness: >-
    No current production writer legitimately creates an active dynamic route without
    an exact readiness owner. The generic no-readiness restorer is obsolete and must
    be deleted; missing readiness fails closed rather than invoking compatibility.
  forbidden:
    - unconditional_HydrateForStartup
    - legacy_row_reader_or_migration
    - tolerant_route_fallback
    - telegram_specific_branch
    - polling_repair
    - second_readiness_or_liveness_owner
    - generic_startup_framework
    - unscoped_readiness_or_route_list
    - process_side_source_post_filter
    - cross_context_adoption_publication_or_refusal
    - predecessor_plan_reconstruction
    - generic_pending_classification_for_source_transition
    - second_source_transition_writer
    - desired_plan_replacement_without_exact_observed_coordinate
    - global_list_for_automatic_retry_live_revision_or_recovery_diagnostics
    - per_item_transition_transaction_for_multi_item_startup
    - pending_finalizer_publication_before_all_sibling_process_topology
    - autonomous_schedule_timer_maintenance_or_run_lifecycle_work_before_topology
    - second_pipeline_sweep_as_a_substitute_for_producer_ordering

startup_order:
  sequence:
    - all_context_source_scoped_observation_preflight_classifies_three_disjoint_sets_before_any_runtime_mutation
    - predecessor_pending_transition_without_recovery_refuses_all_contexts
    - prerequisite_consumers_and_authority_only_components_construct_without_claiming_publishing_or_executing_work
    - static_declaration_topology_hydrates_and_system_node_subscriptions_become_ready
    - current_source_transition_set_is_revalidated_and_complete_desired_set_is_derived_before_any_write
    - selected_store_batch_compares_every_observation_then_commits_every_replacement_or_none
    - exact_source_projection_is_reloaded_and_any_source_transition_refuses
    - ordinary_pending_rows_are_authorized_or_refuse_under_existing_recovery_policy
    - managed_execution_and_delivery_authorities_are_admitted_without_replay_or_continuation_execution
    - manager_run_starts_the_current_occurrence
    - current_source_projection_is_reloaded_after_manager_run
    - mandatory_topology_only_reconstruction_consumes_completed_rows
    - process_only_preparation_consumes_every_authorized_pending_row_without_timer_or_event_publication
    - exact_agent_lifecycle_routes_loops_and_flow_routes_for_all_rows_are_verified
    - keyed_pending_finalizers_arm_timers_mark_completion_and_publish_creation_events
    - fresh_projection_and_exact_process_verification_close_the_completed_topology_latch
    - recovery_enabled_effect_drain_budget_diagnostic_and_selected_contract_hydration_runs
    - recovery_enabled_pipeline_obligations_replay_to_exhaustion
    - delivery_continuation_owner_starts_and_synchronizes
    - generic_schedule_and_workflow_timer_restore_run_lifecycle_execution_and_pipeline_maintenance_are_released
    - outbox_platform_boot_and_public_ingress_readiness_may_open
  failure_compensation: >-
    Any topology-only reconstruction or verification failure fails Runtime.Start and
    consumes existing start-failure cleanup plus lifecycle/route compensation. It
    cannot leave public readiness open or authorize replay mutation.
  multi_context_atomicity: >-
    Existing serve composition MUST inspect every constructed runtime source through
    the same observation-only typed operation before starting any runtime. Malformed,
    invalid-route, ordinary pending without replay, or predecessor-pending transition
    without replay in any context refuses the all-or-nothing serve before another
    context can acquire process topology. A predecessor-completed transition is valid
    required work, not completed topology. Each Runtime.Start revalidates and performs
    only one exact-source guarded batch write before Manager.Run. No transaction spans
    contexts; all-context observation prevents expected refusal from partially starting
    another context, while a later temporal store conflict aborts that context and the
    existing serve cleanup closes any earlier context before public ingress opens.

user_visible_flow:
  must_succeed_before_observed_failure:
    - authored_bundle_compile_and_verify
    - cold_serve_selected_store_construction_and_public_readiness
    - standing_run_and_dynamic_instance_activation
    - first_signed_provider_ingress_and_typed_raw_settlement
    - first_normalization_agent_delivery_and_effect_settlement
    - quiescence_and_graceful_shutdown
    - selected_store_reopen_and_startup_admission
    - second_signed_provider_ingress_and_normalized_event_commit
  ordered_path:
    - step: cold_static_topology_and_system_nodes
      gate: different_concept_with_proof
      proof: first_boot_and_first_M5_ingress_reach_dynamic_materialization
    - step: standing_dynamic_readiness_activation
      gate: same_chosen_class_fresh_entrance
      proof: first_expected_agent_route_turn_and_effect
    - step: graceful_shutdown
      gate: different_concept_with_proof
      proof: joined_quiescent_process_exit_before_restart
    - step: default_recovery_disabled_reopen
      gate: same_chosen_class_startup_policy
      proof: completed_readiness_exists_but_HydrateForStartup_is_skipped
    - step: managed_execution_authority_admission
      gate: same_chosen_class_ordering
      proof: authority_is_bound_without_pipeline_replay_or_continuation_execution
    - step: exact_source_transition_batch
      gate: same_chosen_class_atomicity
      proof: every_observed_plan_is_compared_and_all_replacements_commit_or_none_do
    - step: Manager_Run
      gate: same_chosen_class_ordering
      proof: current_occurrence_starts_before_any_recovery_delivery_can_execute
    - step: complete_process_topology_preparation
      gate: same_chosen_class_missing_entrance
      proof: all_completed_and_authorized_pending_rows_have_exact_agents_and_routes_before_any_pending_finalizer_publishes
    - step: pending_finalization_and_completed_topology_latch
      gate: same_chosen_class_downstream_fence
      proof: exact_timers_completion_and_creation_publish_only_after_all_receivers_then_fresh_projection_proves_complete
    - step: recovery_pipeline_replay_then_delivery_continuation_sync
      gate: same_chosen_class_downstream_fence
      proof: replay_and_continuations_cannot_execute_before_process_topology_is_executable
    - step: schedule_timer_maintenance_run_lifecycle_and_outbox_release
      gate: same_chosen_class_autonomous_producer_fence
      proof: due_work_cannot_claim_publish_or_execute_until_topology_and_continuation_are_live
    - step: public_readiness_and_ingress
      gate: same_chosen_class_publication_fence
      proof: executable_endpoints_remain_fail_closed_until_Runtime_Start_completes
    - step: second_normalized_event_routing
      gate: same_chosen_class_manifestation
      proof: exact_entity_recipient_delivery_turn_and_effect_required
    - step: terminal_singleton_delivery_materialization
      gate: explicitly_split_to_issue_2339
      proof: this_defect_never_selects_a_recipient_or_creates_a_delivery

startup_posture_matrix:
  graceful_default_recovery_disabled:
    policy: current_completed_topology_reconstructs_ordinary_pending_refuses
    proof: unchanged_issue_2008_M5
  cold_source_revision_recovery_disabled:
    policy: predecessor_completed_canonicalizes_to_current_plan_then_reconstructs_predecessor_pending_refuses
    proof: supported_standing_cold_revision_matrix_on_both_stores
  forced_death_default_recovery_disabled:
    policy: existing_blocking_delivery_or_timer_work_refuses_before_serving
    proof: issue_2008_ratified_default_refusal_scenario
  explicit_recovery_enabled:
    policy: completed_topology_reconstructs_then_interrupted_pipeline_and_delivery_work_recovers
    proof: issue_2008_recovery_scenario_without_duplicate_effect
  dev_abandon:
    policy: predecessor_is_terminalized_before_runtime_start_then_only_successor_eligible_topology_executes
    proof: issue_2008_dev_new_generation_scenario
  multi_context_persistent_recovery_disabled:
    policy: >-
      DisablePersistentStartupRecovery disables unscoped replay, not mandatory
      topology. Every context is inspected by exact BundleSourceFact before any
      runtime starts, ordinary pending or predecessor-pending work refuses all-or-
      nothing serve, predecessor-completed transition is canonicalized only for its
      exact context, and each started context reconstructs only current completed
      topology.
    proof: two_pinned_PostgreSQL_contexts_isolation_refusal_and_no_unscoped_reads

