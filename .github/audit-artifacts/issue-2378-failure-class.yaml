      - both_variants_receive_successor_process_binding
      - aggregate_execution_admission_reopens_only_after_every_runtime_converges_and_publication_succeeds
    decision_status: approved_by_independent_gate

binding_design:
  canonical_census:
    owner: AgentLifecycleCellCensus
    operation: ListDurableAgentLifecycleStates
    source_selection: >-
      Consume the complete validated census and select the manager's exact
      BundleSourceFact from canonical ProcessExecutionBinding fields. Admission
      JSON, HiredBy, identity syntax, flow-path shape, process hydration lists,
      and lifecycle status filters are not census owners.
    row_validation:
      - identity_is_canonical_and_unique
      - topology_admission_is_valid_and_matches_persisted_authority_kind_and_lifetime
      - execution_lifetime_is_durable_managed
      - process_binding_is_valid
      - source_coordinate_matches_exact_runtime_or_is_a_different_context
  process_cross_check:
    rules:
      - every_exact_source_nonterminated_durable_row_has_one_exact_process_local_cell
      - every_exact_source_nonterminated_durable_process_cell_has_one_census_row
      - lifecycle_identity_epoch_generation_phase_run_mode_config_revision_topology_and_binding_are_compared
      - terminated_rows_are_census_visible_and_inert
      - ephemeral_process_cells_are_excluded_and_cannot_appear_in_the_durable_census
    missing_process_cell: fail_preparation_before_source_set_mutation
    reconstruction: forbidden_in_live_replacement_and_owned_by_2351_startup
  per_variant_target:
    static_declaration_plan:
      topology: exact_successor_static_admission_for_the_same_source_coordinate
      process_binding: exact_successor_runtime_generation_grant
      preserved:
        - lifecycle_epoch
        - lifecycle_generation
        - lifecycle_phase
        - lifecycle_run_mode
        - config_revision
    flow_readiness_plan:
      topology: exact_existing_sealed_readiness_admission
      process_binding: exact_successor_runtime_generation_grant
      preserved:
        - lifecycle_epoch
        - lifecycle_generation
        - lifecycle_phase
        - lifecycle_run_mode
        - config_revision
        - run_id
        - instance_path
        - plan_fingerprint
  transition_serialization:
    owner: existing_AgentManager_lifecycle_coordinator
    publication_lock: executionPublishMu
    identity_lock: agentLifecycleCell.opMu
    required_creator_change: registerExecutionWithTopology_consumes_existing_publication_lock
    already_serialized:
      - start_restart_reconfigure_replacement_via_replaceExecutionTargetConfigWithTopology
      - teardown_self_release_and_delivery_acquisition_via_per_identity_operation_lock
    rule: >-
      Preparation acquires creator publication serialization before the durable
      census and holds every inventoried identity operation lock before the
      complete source-set head can mutate. A creator cannot publish a new
      durable cell between census and head mutation.
  aggregate_execution_fence:
    owner: existing_prepared_RuntimeContextManager_to_Runtime_to_AgentManager_source_set_transition
    behavior:
      - close_new_execution_selection_before_source_set_mutation
      - preserve_already_accepted_work_and_existing_route_identity
      - make_dequeued_delivery_wait_or_fail_as_unaccepted_without_success_settlement
      - reject_new_direct_execution_and_lifecycle_mutation_with_typed_transition_conflict
      - reopen_predecessor_execution_on_pre_head_abort_only
      - retain_fence_after_head_commit_or_any_partial_survivor_failure
      - reopen_only_after_every_runtime_durable_and_process_projection_converges_and_aggregate_publication_succeeds
    forbidden_shortcuts:
      - context_visibility_only
      - remove_and_recreate_EventBus_routes
      - mark_execution_permanently_fenced_and_kill_the_existing_loop
      - settle_waiting_delivery_as_success_or_dead_letter_because_transition_is_pending
      - reopen_an_earlier_runtime_before_a_later_runtime_converges
      - infer_completion_from_the_current_source_set_head_alone
  durable_commit_and_replay:
    transaction_scope: one_existing_selected_store_lifecycle_transition_per_cell
    no_cross_row_transaction: true
    operation_identity: deterministic_from_exact_source_set_operation_scope_plan_identity_and_lifecycle_coordinate
    target_binding: exact_successor_generation_grant
    replay_coordinates:
      - exact_predecessor_binding_for_first_or_partially_uncommitted_row
      - exact_successor_binding_for_already_committed_row
    reject:
      - foreign_process_authority_owner_or_boot
      - foreign_source_or_runtime_instance
      - non_adjacent_runtime_generation
      - changed_lifecycle_occurrence
      - changed_topology_or_config_revision
      - conflicting_operation_id_or_request_hash
    process_publication: all_or_none_per_runtime_after_every_row_commit
    aggregate_execution_publication: all_or_none_across_every_surviving_runtime

