class_model:
  issue_category: p1_runtime_lifecycle_selected_store_semantic_drift_architecture_and_backend_parity
  observed_symptom: >-
    Live complete-source-set replacement rotates each surviving runtime to an
    admitted successor generation grant, but the prepared manager helper
    inventories only StaticDeclarationPlan cells. A surviving durable
    FlowReadinessPlan cell can retain the predecessor process binding and remain
    reachable through an already-published lifecycle route.
  exact_concepts:
    - complete_durable_lifecycle_survivor_census
    - sealed_variant_specific_topology_rebind
    - successor_runtime_generation_process_binding
    - process_local_lifecycle_projection_publication
    - creator_replacer_destroyer_transition_serialization
    - prepared_and_partial_progress_execution_admission_fencing
    - deterministic_partial_rebind_replay
    - aggregate_cross_runtime_convergence_before_execution_reopening
  chosen_working_failure_class: live_source_set_transition_complete_durable_survivor_rebind_and_execution_admission_fencing
  immediate_parent_failure_class: mixed_authority_survivor_generation_reconciliation
  parent_failure_class: declaration_source_set_and_lifecycle_process_authority_atomic_publication
  broadest_parent_failure_class: multi_phase_runtime_topology_and_lifecycle_orchestration
  architecture_parent_issue: 2250
  framing_before_audit: too_narrow_flow_cell_write_only
  framing_after_audit: broad_enough_after_absorbing_census_creator_serialization_and_retained_aggregate_execution_fence
  class_stop_reason: >-
    Live replacement, predecessor rollback, and bundle-delete survivor replay
    share one complete source-set transition, one lifecycle census, one runtime
    generation grant relation, and one all-survivor publication boundary. Cold
    startup takeover, removed-source retirement, empty destructive reset, and
    ephemeral execution have different operation and lifetime owners.
  entry_point_not_boundary: >-
    PrepareStaticTopologySourceSetRebind and the fixture failure were entry
    points. The audit covers every complete-source-set writer, every live
    survivor producer and lifecycle consumer, process and route selection,
    success, abort, partial progress, rollback, retained retry, restart/readback,
    multi-context publication, and both selected stores.
  intended_closure_level: chosen_working_failure_class_eliminated
  chosen_class_closure_commitment: true
  closure_feasible_in_one_pr: true
  local_endpoint_fix_leaves_same_concept_interpreters: true
  complete_bounded_fix_leaves_same_concept_interpreters: false

