  focused_test_policy:
    targeted: regular_go_test
    whole_suite: go_run_./cmd/swarm-test

architecture_feedback:
  smell: >-
    The runtimeProjectSupervisor retained a complete product reload implementation
    after the public transport and product contract retired it. Bundle deletion
    then reused that machinery for a narrower compensation need, causing an
    unsupported changed-bundle state machine to become a dependency of a
    supported destructive operation.
  long_run_direction: >-
    Product-visible lifecycle methods must own explicit typed process operations.
    Bundle deletion should own exact quiesce/remove/restore/replay, startup should
    own install/restore, process shutdown should own execution retirement, and
    run.fork should own changed-bundle continuation. No generic supervisor reload
    interpreter should sit above them.
  tracking_decision: update_existing_issue_2250_and_watchlist_only
  new_issue: false
  estimated_effort_for_broader_smell: multi_PR_medium_to_high
  ROI: high_but_non_closure_bearing_for_2378

