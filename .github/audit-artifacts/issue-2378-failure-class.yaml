prior_gate:
  status: superseded
  reason: >-
    The prior audit treated retired Builder project reload and live source-set
    replacement as a supported product operation. The authoritative Builder API
    disposition already retires project.open, project.reload, project.close,
    and source replacement, while production serve mounts only internal/apiv1.
    The previous implementation and closure claim are therefore non-binding.
current_gate:
  status: requested
  implementation_frozen: true

category:
  severity: P1
  kinds:
    - semantic_drift
    - retired_product_operation_removal
    - runtime_lifecycle
    - selected_store_parity
    - architecture_simplification

observed_symptom: >-
  A retired and production-unmounted Builder project mutation surface remains a
  live internal semantic owner. Its supervisor can replace the process complete
  source set and publish a changed bundle beneath existing run-bound authority.
  The one supported operation that still removes a source, bundle.delete,
  borrows that retired replacement state machine for runtime quiescence and
  restoration and then refreshes only static durable survivors. Removing only
  the local static helper defect would preserve the invalid product owner and
  its rollback machinery.

entry_point_not_boundary:
  confirmed: true
  entry_points:
    - internal/runtime/manager/static_topology.go PrepareStaticTopologySourceSetRebind
    - internal/runtime/context_manager.go PrepareSourceSetTransition
    - internal/serveapp/builder_project_supervisor.go loadProject and ReplaceSourceSet
    - internal/serveapp/bundle_delete_runtime_quiescence.go
  audited_boundary: >-
    The audit includes the product/API mount, every complete source-set writer,
    every supervisor and RuntimeContextManager replacement API, run-bound bundle
    authority, run.fork, startup install/restore, process shutdown, destructive
    reset, bundle-delete apply/replay, survivor lifecycle projection, execution
    admission, both selected stores, and replacement-only tests/spec claims.

