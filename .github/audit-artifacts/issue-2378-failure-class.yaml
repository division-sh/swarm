observed_symptom: >-
  The complete retired and production-unmounted internal/builder JSON-RPC and
  WebSocket transport remains compiled through tests. Its sole non-test import
  is runtimeProjectSupervisor project/status coupling, which also owns the only
  live ReplaceSourceSet producer and can publish a changed bundle beneath
  existing run-bound authority. The supported bundle.delete operation borrows
  that retired replacement state machine for quiescence/restoration and then
  refreshes only static durable survivors. Removing only project methods or the
  local static helper would preserve the retired transport boundary and invalid
  semantic owner.

entry_point_not_boundary:
  confirmed: true
  entry_points:
    - internal/runtime/manager/static_topology.go PrepareStaticTopologySourceSetRebind
    - internal/runtime/context_manager.go PrepareSourceSetTransition
    - internal/serveapp/builder_project_supervisor.go loadProject and ReplaceSourceSet
    - internal/serveapp/bundle_delete_runtime_quiescence.go
  audited_boundary: >-
    The audit includes the product/API mount, every complete source-set writer,
    every internal/builder file, exported contract, test-only importer and
    architecture/work-lifetime guard, every supervisor and RuntimeContextManager
    replacement API, run-bound bundle authority, run.fork, startup install/restore,
    process shutdown, destructive reset, bundle-delete apply/replay, survivor
    lifecycle projection, execution admission, both selected stores, and every
    ambiguous replacement occurrence in the authoritative spec.

