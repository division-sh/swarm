        deletion changes the complete head only through its named atomic final mutation.
    bundle_delete_runtime_quiescence:
      owner: serveapp.bundleDeleteRuntimeQuiescer_and_processLifecycleSupervisor
      consumers:
        - loaded_target_apply
        - unloaded_target_apply
        - precommit_failure_compensation
        - committed_delete_replay
