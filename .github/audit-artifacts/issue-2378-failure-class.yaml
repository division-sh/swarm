    Widening only the static survivor helper leaves the retired replacement
    producer, changed-bundle publication owner, and replacement rollback state
    live. Deleting those first leaves one supported bundle-delete transition that
    can be closed in one bounded implementation.

required_supported_surface_proof:
  parity_issue: true
  feature_parity_claim: false
  PostgreSQL:
    - real_served_bundle_delete_force_and_non_force
    - loaded_and_unloaded_target
    - precommit_restore
    - mixed_static_and_flow_survivors
    - exact_idempotent_replay_after_partial_survivor_progress
    - restart_readback
  SQLite:
