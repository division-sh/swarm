    - source_set_rebind_preserves_lifecycle_occurrence_phase_run_mode_and_config_revision
    - process_local_topology_and_binding_publish_only_after_every_durable_rebind_commits
    - durable_partial_progress_is_deterministic_idempotent_and_resumable
    - predecessor_bound_stale_and_partially_rebound_survivors_are_unselectable
    - ephemeral_execution_is_nonpersistable
    - fresh_store_only_without_migration_inference_or_compatibility
  same_pr_spec_clarification_required:
