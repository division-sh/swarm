      systematic_consumption: >-
        The selected-store lifecycle census is complete and sealed-variant aware.
        One aggregate admission fences registration, start, restart, reconfigure,
        loop release, direct execution, and delivery execution until exact abort or
        convergence. A dedicated source-set publication RW lock prevents a source-set
        writer from opening between gate recheck and route/loop settlement without
        deadlocking ordinary generation replacement.

