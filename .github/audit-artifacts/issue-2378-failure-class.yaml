architecture_feedback:
  smell: >-
    The complete Builder transport remained compiled through tests after production
    and the product contract retired it. Its supervisor coupling retained a product
    reload interpreter, and bundle deletion then reused that machinery for narrow
    compensation. Test-only compilation allowed an unsupported transport and
    changed-bundle state machine to remain semantic owners.
  long_run_direction: >-
    Product-visible lifecycle methods must own explicit typed process operations.
    Bundle deletion should own exact quiesce/remove/restore/replay, startup should
    own install/restore, process shutdown should own execution retirement, and
    run.fork should own changed-bundle continuation. No generic supervisor reload
    interpreter should sit above them.
  tracking_decision: absorb_375_update_2250_refine_watchlist_split_dashboard_to_2390
  new_issue: false
  estimated_effort_for_broader_smell: multi_PR_medium_to_high
  ROI: high_but_non_closure_bearing_for_2378

