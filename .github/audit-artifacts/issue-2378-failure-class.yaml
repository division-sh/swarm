      systematic_consumption: >-
        Quiescence owns one exact predecessor occurrence and may restore only that
        same source before commit. It cannot publish a changed bundle or serve as a
        generic replacement owner. Terminal process-ownership loss still forces
        runtime shutdown even when pending-transition settlement can no longer use
        the terminal capability.
