name: DIAGNOSTIC ONLY - 2614 original cause

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewer-approved diagnostic commit (full SHA)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-2614-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}

jobs:
  diagnostic-plan:
    name: DIAGNOSTIC ONLY - canonical plan and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Admit diagnostic identity (never qualification)
        run: bash .github/diagnostics/2614/identity.sh
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared modules
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - run: go mod download
      - name: Restore production compilation cache read-only
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: diagnostic-2614-production-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-production-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
      - name: Compile production dependencies (original setup)
        run: |
          go build ./...
          go build -race -o "$RUNNER_TEMP/swarm-ci-race" ./cmd/swarm
      - name: Generate full canonical plan; bind unchanged batch
        run: |
          set -euo pipefail
          go list ./... > test-results/diagnostic-plan/go-packages.txt
          go run ./cmd/swarm-test-timing -plan-ci \
            -proof-policy .github/test-proof-plan.yaml \
            -weight-model .github/test-timing-weights.json \
            -packages test-results/diagnostic-plan/go-packages.txt \
            -event workflow_dispatch -profile full -head-sha "$(git rev-parse HEAD)" \
            -plan test-results/diagnostic-plan/proof-plan.json \
            -matrix test-results/diagnostic-plan/proof-matrix.json \
            -markdown test-results/diagnostic-plan/proof-plan.md
          bash .github/diagnostics/2614/selection.sh test-results/diagnostic-plan/proof-plan.json
      - name: Warm exact release products (compile only)
        run: |
          go run ./cmd/swarm-test-timing -warm-build-products \
            -plan test-results/diagnostic-plan/proof-plan.json -build-cache "$RUNNER_TEMP/swarm-build-products"
      - name: Save diagnostic-only compilation cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: diagnostic-2614-production-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - name: Upload diagnostic plan even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-2614-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/diagnostic-plan
          if-no-files-found: error
      - name: Upload compilation-only products
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-2614-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swarm-build-products
          if-no-files-found: error

  diagnostic-unit:
    name: DIAGNOSTIC ONLY - serveapp-runtime
    needs: [diagnostic-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      BATCH_ID: serveapp-runtime
      KEEP_GOING: "false"
      SWARM_TOOL_GATEWAY_URL: ""
      SWARM_TOOL_GATEWAY_CONTAINER_URL: ""
      SWARM_TOOL_GATEWAY_TOKEN: ""
      SWARM_TEST_2614_ORIGINAL_CAUSE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Admit exact diagnostic identity
        run: bash .github/diagnostics/2614/identity.sh
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-2614-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/plan
      - uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-2614-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swarm-build-products
      - name: Restore measured Go cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: diagnostic-2614-production-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-serveapp-runtime-${{ github.ref_name }}-
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-serveapp-runtime-
      - name: Validate unchanged selection and record environment
        run: |
          bash .github/diagnostics/2614/selection.sh test-results/plan/proof-plan.json
          bash .github/diagnostics/2614/environment.sh
      - name: Run original canonical batch ONCE (private raw output)
        shell: bash
        env:
          SWARM_TEST_BUILD_CACHE: ${{ runner.temp }}/swarm-build-products
        run: |
          set -uo pipefail
          private="$RUNNER_TEMP/diagnostic-2614-private"
          mkdir -p "$private"
          date -u +%FT%TZ > "$private/started.txt"
          set +e
          bash .github/scripts/run-proof-batch.sh > "$private/stdout.log" 2> "$private/stderr.log"
          code=$?
          set -e
          printf '%s\n' "$code" > "$private/wrapper-exit.txt"
          date -u +%FT%TZ > "$private/finished.txt"
          printf 'DIAGNOSTIC ONLY: canonical wrapper exit=%s; no qualification credit.\n' "$code"
          exit "$code"
      - name: Collect bounded redacted evidence even on failure
        if: always()
        run: bash .github/diagnostics/2614/collect.sh
      - name: Upload DIAGNOSTIC ONLY evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-2614-${{ github.run_id }}-${{ github.run_attempt }}-serveapp-runtime
          path: test-results/diagnostic-evidence
          if-no-files-found: error
