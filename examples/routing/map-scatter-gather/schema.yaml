name: map-scatter-gather
stages:
  waiting: {initial: true}
  collecting: {}
  complete: {terminal: true}
  failed: {terminal: true}
pins:
  inputs:
    events: [batch.ready, item.reported]
  outputs:
    events: [item.requested]
connect:
  - {event: item.requested, from: ., to: workers, resolution: select-or-create}
  - {event: item.reported, from: workers, to: .}
