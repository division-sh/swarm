name: template-select-existing
version: "1.0.0"
platform_version: ">=0.7.0 <0.8.0"
flows:
  - id: producer
    flow: producer
    mode: static
  - id: account
    flow: account
    mode: template
connect:
  - event: account.setup
    from: producer
    to: account
  - event: account.ready
    from: producer
    to: account
