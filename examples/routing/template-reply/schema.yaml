name: template-reply
pins:
  inputs:
    events: [requester.setup.requested, request.submitted]
  outputs:
    events: [requester.setup.requested, request.submitted]
connect:
  - event: requester.setup.requested
    from: .
    to: initiator
  - event: request.submitted
    from: .
    to: initiator
  - event: requester.setup
    from: initiator
    to: requester
    resolution: select-or-create
  - event: requester.requested
    from: initiator
    to: requester
    resolution: select
  - event: provider.requested
    from: requester
    to: provider
  - event: provider.replied
    from: provider
    to: requester
