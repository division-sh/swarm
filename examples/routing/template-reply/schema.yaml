name: template-reply
pins:
  inputs:
    - requester.setup.requested
    - request.submitted
  outputs:
    - requester.setup.requested
    - request.submitted
connect:
  - event: requester.setup.requested
    from: .
    to: initiator
  - event: request.submitted
    from: .
    to: initiator
  - event: requester.setup
    from: initiator
    resolution: select-or-create
    to: requester
  - event: requester.requested
    from: initiator
    resolution: select
    to: requester
  - event: provider.requested
    from: requester
    to: provider
  - event: provider.replied
    from: provider
    replies_to: provider.requested
    to: requester
