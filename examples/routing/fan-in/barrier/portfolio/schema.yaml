name: portfolio
mode: singleton
stages:
  collecting:
    initial: true
  awaiting: {}
  complete:
    terminal: true
  failed:
    terminal: true
pins:
  inputs:
    events:
      - event: portfolio.setup
        source: external
      - event: operating.reported
        resolution:
          mode: fan-in
          aggregation: barrier
          window: payload.period_id
          dedup_by: [payload.operating_id]
          singleton: portfolio
