name: fan-in-barrier
pins:
  inputs:
    events: [operating.report.triggered, portfolio.setup]
  outputs:
    events: [operating.report.triggered, portfolio.setup]
connect:
  - event: operating.report.triggered
    from: .
    to: ingress
  - event: portfolio.setup
    from: .
    to: portfolio
  - event: operating.report.requested
    from: ingress
    to: operating
  - event: operating.reported
    from: operating
    to: portfolio
