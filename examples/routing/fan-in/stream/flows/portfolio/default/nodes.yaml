portfolio-collector:
  id: portfolio-collector
  execution_type: system_node
  subscribes_to: [operating.reported]
  event_handlers:
    operating.reported:
      accumulate:
        into: operating_reports
        from: payload
      data_accumulation:
        writes:
          - op: set
            target: entity.reports
            key: {ref: payload.operating_id}
            value: {ref: payload}
          - source_field: revenue
            target_field: last_revenue
