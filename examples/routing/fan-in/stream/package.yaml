name: fan-in-stream
version: "1.0.0"
platform_version: ">=0.7.0 <0.8.0"
flows:
  - id: ingress
    flow: ingress
    mode: static
  - id: operating
    flow: operating
    mode: template
  - id: portfolio
    flow: portfolio/default
    mode: singleton
connect:
  - event: operating.report.requested
    from: ingress
    to: operating
  - event: operating.reported
    from: operating
    to: portfolio
