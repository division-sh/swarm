name: fan-in-stream
pins:
  inputs:
    events: [operating.report.triggered]
  outputs:
    events: [operating.report.triggered]
connect:
  - event: operating.report.triggered
    from: .
    to: ingress
  - event: operating.report.requested
    from: ingress
    to: operating
  - event: operating.reported
    from: operating
    to: portfolio
