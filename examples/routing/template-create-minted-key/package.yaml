name: template-create-minted-key
version: "1.0.0"
platform_version: ">=0.7.0 <0.8.0"
flows:
  - id: producer
    flow: producer
    mode: static
  - id: validator
    flow: validator
    mode: template
connect:
  - event: validation.requested
    from: producer
    to: validator
  - event: validation.started
    from: validator
    to: producer
