name: validator
mode: template
instance: validation_case_id
pins:
  inputs:
    events:
      - name: validation_requested
        event: validation.requested
        resolution:
          mode: create
        carries:
          validation_case_id:
            from: generated.uuid
            type: uuid
  outputs:
    events:
      - name: validation_started
        event: validation.started
        key: validation_case_id
        carries: [validation_case_id]
