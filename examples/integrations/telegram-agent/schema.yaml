stages:
  active:
    gate:
      decision: retire_service
      outcomes:
        retire:
          advances_to: done
  done:
    final: true
pins:
  inputs:
    - inbound.telegram.text_message
  outputs:
    - inbound.telegram.text_message
connect:
  - event: inbound.telegram.text_message
    from: .
    to: telegram-chat
    resolution: select-or-create
