name: telegram-ingress
stages:
  active:
    gate:
      decision: retire_service
      outcomes:
        retire:
          advances_to: done
  done:
    final: true
inputs:
  - inbound.telegram
outputs:
  - inbound.telegram.text_message
ingress:
  alias: chat
  providers:
    - provider: telegram
      signing_secret: webhook_signing.telegram
