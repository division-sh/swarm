name: telegram-ingress
mode: singleton
stages:
  active:
    initial: true
    gate:
      decision: retire_service
      outcomes:
        retire:
          advances_to: done
  done:
    terminal: true
pins:
  inputs:
    events:
      - event: inbound.telegram
        source: external
activation: standing
ingress:
  alias: chat
  providers:
    - provider: telegram
      signing_secret: webhook_signing.telegram
