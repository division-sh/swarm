name: telegram-agent-bot
version: "1.0.0"
platform_version: ">=0.7.0 <0.8.0"
requires:
  credentials: [telegram_bot_token]
connector_packs:
  imports:
    - provider: telegram
      tool: telegram.send_message
provider_trigger_events:
  imports:
    - provider: telegram
      event: inbound.telegram.text_message
flows:
  - id: telegram-chat
    flow: telegram-chat
    mode: template
