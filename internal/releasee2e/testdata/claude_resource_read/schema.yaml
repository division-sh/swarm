name: claude-resource-read
stages:
  pending: {initial: true}
  done: {terminal: true}
pins:
  inputs:
    - task.assigned
    - task.finished
    - records.loaded
  outputs:
    - task.assigned
    - task.finished
connect:
  - {event: task.assigned, from: ., to: worker}
  - {event: task.finished, from: ., to: worker}
  - {event: records.loaded, from: worker, to: .}
