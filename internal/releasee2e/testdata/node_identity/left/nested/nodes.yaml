worker:
  execution_type: system_node
  subscribes_to: [entry.nested, work.processed]
  produces: [work.processed]
  event_handlers:
    entry.nested:
      advances_to: working
      emit:
        event: work.processed
        fields: {marker: payload.marker, origin: '"left/nested"'}
    work.processed:
      advances_to: done
