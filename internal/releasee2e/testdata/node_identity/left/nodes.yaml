worker:
  entry.left:
    advances_to: working
    emit:
      event: work.processed
      fields: {marker: payload.marker, origin: "left"}
  work.processed:
    advances_to: done
  work.routed:
    advances_to: working
    emit:
      event: work.observed
      fields: {marker: payload.marker, origin: "left"}
  work.observed:
    advances_to: done
