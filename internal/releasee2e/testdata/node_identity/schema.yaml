name: node-identity
stages:
  pending: {initial: true}
  working: {}
  done: {terminal: true}
pins:
  inputs:
    - entry.root
    - entry.left
    - entry.right
    - entry.nested
  outputs:
    - work.routed
    - entry.left
    - entry.right
    - entry.nested
connect:
  - {event: entry.left, from: ., to: left}
  - {event: entry.right, from: ., to: right}
  - {event: entry.nested, from: ., to: left/nested}
  - {event: work.routed, from: ., to: left}
