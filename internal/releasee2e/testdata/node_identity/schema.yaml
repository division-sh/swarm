name: node-identity
initial_state: pending
terminal_states: [done]
states: [pending, working, done]
pins:
  inputs:
    events:
      - entry.root
      - entry.left
      - entry.right
      - entry.nested
  outputs:
    events: [work.routed, entry.left, entry.right, entry.nested]
connect:
  - {event: entry.left, from: ., to: left}
  - {event: entry.right, from: ., to: right}
  - {event: entry.nested, from: ., to: left/nested}
  - {event: work.routed, from: ., to: left}
