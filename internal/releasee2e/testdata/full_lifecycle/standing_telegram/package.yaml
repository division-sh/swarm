name: full-lifecycle-standing
version: "1.0.0"
platform_version: ">=0.7.0 <0.8.0"
packages:
  - id: bot
    path: bot
    bind:
      credentials:
        telegram_bot_token: telegram_bot_token
flows:
  - id: telegram-ingress
    flow: telegram-ingress
    mode: singleton
    activation: standing
    ingress:
      alias: chat
      providers:
        - provider: telegram
          signing_secret: webhook_signing.telegram
