name: telegram-ingress
stages:
  warming:
    timers:
      - id: warmup
        after: 100ms
        advances_to: review
  review:
    gate:
      decision: lifecycle_ready
      title: Confirm lifecycle readiness
      outcomes:
        approve:
          label: Continue
          advances_to: serving
        reject:
          label: Retire
          advances_to: retired
  serving: {}
  retired:
    final: true
pins:
  inputs:
    - inbound.telegram
  outputs:
    - inbound.telegram.text_message
activation: standing
ingress:
  alias: chat
  providers:
    - provider: telegram
      signing_secret: webhook_signing.telegram
