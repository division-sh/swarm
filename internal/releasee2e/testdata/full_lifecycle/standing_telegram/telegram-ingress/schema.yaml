name: telegram-ingress
stages:
  warming:
    timers:
      - after: 100ms
        advances_to: review
  review:
    gate:
      decision: confirm_lifecycle_readiness
      outcomes:
        continue:
          advances_to: serving
        retire:
          advances_to: retired
  serving: {}
  retired:
    final: true
inputs:
  - inbound.telegram
outputs:
  - inbound.telegram.text_message
ingress:
  alias: chat
  providers:
    - provider: telegram
      signing_secret: webhook_signing.telegram
