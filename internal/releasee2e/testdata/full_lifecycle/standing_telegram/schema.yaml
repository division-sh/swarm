# fixture: telegram-lifecycle
stages:
  warming:
    timers:
      - after: 100ms
        advances_to: review
  review:
    gate:
      decision: lifecycle_ready
      outcomes:
        approve:
          advances_to: serving
        reject:
          advances_to: retired
  serving: {}
  retired:
    final: true
pins:
  inputs:
    - inbound.telegram.text_message
  outputs:
    - inbound.telegram.text_message
connect:
  - event: inbound.telegram.text_message
    from: .
    to: telegram-chat
    resolution: select-or-create
