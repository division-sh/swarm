name: static-data-invocation
stages:
  pending: {initial: true}
  reading: {}
  child_reading: {}
  complete: {terminal: true}
pins:
  inputs:
    - read.requested
    - child.completed
  outputs:
    - child.requested
connect:
  - {event: child.requested, from: ., to: registry, resolution: select-or-create}
  - {event: child.completed, from: registry, to: .}
