intake:
  read.requested:
    advances_to: reading
    data_accumulation:
      writes:
        - {source_field: request_key, target_field: request_key}
    emit:
      event: read.work
      fields: {foreign_id: payload.foreign_id}
root-completion:
  read.completed:
    guard: instance.stage == 'reading'
    advances_to: child_reading
    data_accumulation:
      writes:
        - {source_field: content, target_field: content}
    emit:
      event: child.requested
      fields: {request_key: state.request_key}
child-completion:
  child.completed:
    advances_to: complete
