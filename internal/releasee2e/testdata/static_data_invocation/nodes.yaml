intake:
  execution_type: system_node
  subscribes_to: [read.requested]
  produces: [read.work]
  event_handlers:
    read.requested:
      create_entity: true
      advances_to: reading
      data_accumulation:
        writes:
          - {source_field: request_key, target_field: request_key}
      emit:
        event: read.work
        fields: {foreign_id: payload.foreign_id}
root-completion:
  execution_type: system_node
  subscribes_to: [read.completed]
  produces: [child.requested]
  event_handlers:
    read.completed:
      advances_to: child_reading
      data_accumulation:
        writes:
          - {source_field: content, target_field: content}
      emit:
        event: child.requested
        fields: {request_key: entity.request_key}
child-completion:
  execution_type: system_node
  subscribes_to: [child.completed]
  event_handlers:
    child.completed:
      advances_to: complete
