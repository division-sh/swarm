name: telegram-chat
imports:
  provider_trigger_events:
    - provider: telegram
      event: inbound.telegram.text_message
mode: template
instance: conversation_reference
initial_state: active
states: [active]
pins:
  inputs:
    events:
      - event: inbound.telegram.text_message
        source: external
        resolution:
          mode: select-or-create
