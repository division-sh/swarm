candidate-intake:
  candidate.requested:
    advances_to: active
    data_accumulation:
      writes:
        - source_field: candidate_id
          target_field: candidate_id
    emit:
      event: candidate.work.requested
      fields:
        batch_id: payload.batch_id
        candidate_id: payload.candidate_id

candidate-completion:
  candidate.analyzed:
    advances_to: complete
    emit:
      event: candidate.completed
      fields:
        batch_id: payload.batch_id
        candidate_id: payload.candidate_id
        summary: payload.summary
