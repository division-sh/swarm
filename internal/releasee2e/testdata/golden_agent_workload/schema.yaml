name: golden-agent-workload
stages:
  pending:
    initial: true
  scouting: {}
  collecting: {}
  complete:
    terminal: true
  failed:
    terminal: true
pins:
  inputs:
    events:
      - search.requested
      - scout.completed
      - candidate.completed
  outputs:
    events:
      - scout.requested
      - candidate.requested
connect:
  - event: scout.requested
    from: .
    to: scout
  - event: scout.completed
    from: scout
    to: .
  - event: candidate.requested
    from: .
    to: candidate
    resolution: select-or-create
  - event: candidate.completed
    from: candidate
    to: .
