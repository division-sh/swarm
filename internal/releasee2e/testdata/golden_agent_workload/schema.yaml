name: golden-agent-workload
stages:
  pending:
    initial: true
  scouting: {}
  collecting: {}
  complete:
    terminal: true
  failed:
    terminal: true
pins:
  inputs:
    events:
      - name: search_requested
        event: search.requested
        source: external
      - name: scout_completed
        event: scout.completed
      - name: candidate_completed
        event: candidate.completed
  outputs:
    events:
      - name: scout_requested
        event: scout.requested
      - name: candidate_requested
        event: candidate.requested
