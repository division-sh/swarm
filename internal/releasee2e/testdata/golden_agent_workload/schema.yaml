name: golden-agent-workload
stages:
  pending:
    initial: true
  scouting: {}
  collecting: {}
  complete:
    terminal: true
  failed:
    terminal: true
pins:
  inputs:
    events:
      - event: search.requested
        source: external
      - scout.completed
      - candidate.completed
  outputs:
    events:
      - scout.requested
      - candidate.requested
