name: golden-agent-workload
version: "1.0.0"
platform_version: ">=0.7.0 <0.8.0"
flows:
  - id: scout
    flow: scout
    mode: singleton
  - id: candidate
    flow: candidate
    mode: template
connect:
  - event: scout.requested
    from: .
    to: scout
  - event: scout.completed
    from: scout
    to: .
  - event: candidate.requested
    from: .
    to: candidate
  - event: candidate.completed
    from: candidate
    to: .
