scout-intake:
  scout.requested:
    advances_to: active
    emit:
      event: scout.work.requested
      fields:
        query: payload.query
        candidate_ids: payload.candidate_ids

scout-completion:
  scout.completed:
    advances_to: complete
    data_accumulation:
      writes:
        - source_field: candidate_ids
          target_field: candidate_ids
