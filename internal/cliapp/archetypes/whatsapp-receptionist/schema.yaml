name: whatsapp-receptionist
imports:
  connector_packs:
    - provider: whatsapp
      tool: whatsapp.send_text
  provider_trigger_events:
    - provider: whatsapp
      event: inbound.whatsapp.message
stages: []
inputs: [inbound.whatsapp]
outputs: [inbound.whatsapp.message]
ingress:
  alias: reception
  providers:
    - provider: whatsapp
