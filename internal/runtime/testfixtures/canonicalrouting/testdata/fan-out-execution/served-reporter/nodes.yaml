start-portfolio:
  portfolio.opened:
    emit:
      event: portfolio.opened.forwarded
      fields:
        portfolio_id: payload.portfolio_id
        threshold: payload.threshold
numeric-registration-reporter:
  account.registered: {}
close-portfolio:
  portfolio.close.requested:
    emit: {event: portfolio.close.forwarded}
  portfolio.closed:
    advances_to: done
