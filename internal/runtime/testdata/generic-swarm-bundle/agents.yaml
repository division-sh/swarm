control-plane:
  id: control-plane
  role: control-plane
  intent: {inline: "Coordinate generic bundle events."}
  manager_fallback: control-plane
  subscriptions:
    - item.review_requested
    - item.completed
    - item.rejected
  emit_events:
    - item.created
worker-a:
  id: worker-a
  role: worker
  intent: {inline: "Process assigned generic bundle work as worker A."}
  manager_fallback: control-plane
  subscriptions:
    - item.review_requested
    - item.processed
    - item.completed
  emit_events:
    - item.processed
    - item.completed
    - item.rejected
worker-b:
  id: worker-b
  role: worker
  intent: {inline: "Process assigned generic bundle work as worker B."}
  manager_fallback: control-plane
  subscriptions:
    - item.review_requested
    - item.processed
    - item.completed
  emit_events:
    - item.processed
    - item.completed
    - item.rejected
