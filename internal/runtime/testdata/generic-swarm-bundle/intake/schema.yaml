name: intake
mode: static
stages:
  queued: {initial: true}
  collecting: {}
  ready: {}
  rejected: {terminal: true}
pins:
  inputs:
    events:
      - item.created
      - item.processed
      - item.rejected
    reads:
      - priority
  outputs:
    writes:
      - priority
      - results
required_agents:
  - role: control-plane
    subscribes_to:
      - item.review_requested
    emits:
      - item.created
  - role: worker
    subscribes_to:
      - item.processed
    emits:
      - item.processed
