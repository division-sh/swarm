intake-router:
  state_table: intake_router_state
  gate_state:
    intake_ready: gate set when intake is ready
  item.created:
    guard: payload.item_id != ''
    fan_out:
      items_from: payload.items
      as: intake_item
      identity: intake_item.id
      emit:
        event: item.processed
        fields:
          item_id: intake_item.id
          score: intake_item.score
  item.processed:
    accumulate:
      target: processed_items
      key: item_id
    emit:
      event: item.review_requested
      fields:
        score: payload.score
    sets_gate: intake_ready
    clear_gates:
      - needs_revision
