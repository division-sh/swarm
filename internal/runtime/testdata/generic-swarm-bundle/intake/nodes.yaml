intake-router:
  item.created:
    guard: payload.item_id != ''
    fan_out:
      items_from: payload.items
      as: intake_item
      identity: intake_item.id
      emit:
        event: item.processed
        fields:
          item_id: intake_item.id
          score: intake_item.score
  item.processed:
    accumulate:
      target: processed_items
      key: item_id
    emit:
      event: item.review_requested
      fields:
        score: payload.score
    data_accumulation:
      writes:
        - target_field: intake_ready
          value: true
        - target_field: needs_revision
          value: false
