delivery-node:
  timers:
    - event: timer.item.timeout
      delay: 30m
      start_on: state:approved
      cancel_on: state:completed
      recurring: false
  item.completed:
    data_accumulation:
      writes:
        - target_field: delivery_ready
          value: true
        - target_field: intake_ready
          value: false
        - target_field: score_ready
          value: false
  timer.item.timeout:
    advances_to: completed
    emit:
      event: item.completed
    data_accumulation:
      source_event: timer.item.timeout
      writes:
        - target_field: timed_out
          value: true
        - target_field: status
          value: "completed"
