name: delivery
instance: item_id
stages:
  approved: {}
  completed: {final: true}
  rejected: {final: true}
auto_emit_on_create:
  event: item.completed
  description: Seed delivery completion checks when a template instance is created.
pins:
  inputs:
    - item.completed
    - timer.item.timeout
required_agents:
  - role: control-plane
    subscribes_to:
      - item.completed
    emits:
      - item.created
  - role: worker
    subscribes_to:
      - item.completed
    emits:
      - item.completed
