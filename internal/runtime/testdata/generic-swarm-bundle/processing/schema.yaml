name: processing
mode: static
stages:
  ready: {initial: true}
  approved: {}
  rejected: {terminal: true}
pins:
  inputs:
    events:
      - item.review_requested
      - item.rejected
    reads:
      - priority
      - results
  outputs:
    writes:
      - score
      - status
required_agents:
  - role: control-plane
    subscribes_to:
      - item.completed
      - item.rejected
    emits:
      - item.created
  - role: worker
    subscribes_to:
      - item.review_requested
    emits:
      - item.completed
      - item.rejected
