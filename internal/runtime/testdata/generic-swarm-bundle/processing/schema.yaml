name: processing
stages:
  ready: {}
  approved: {}
  rejected: {final: true}
inputs:
  - item.review_requested
  - item.rejected
required_agents:
  - role: control-plane
    subscribes_to:
      - item.completed
      - item.rejected
    emits:
      - item.created
  - role: worker
    subscribes_to:
      - item.review_requested
    emits:
      - item.completed
      - item.rejected
