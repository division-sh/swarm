processing-node:
  item.review_requested:
    guard: policy.delivery_enabled
    compute:
      operation: pick_or_average
      store_as: score
      keys:
        numeric_keys:
          - score
      tiers:
        - dimensions:
            - score
          weight: 1.0
    rules:
      - when: payload.score >= 80.0
        advances_to: approved
        emit:
          event: item.completed
      - advances_to: rejected
        emit:
          event: item.rejected
    data_accumulation:
      writes:
        - target_field: score_ready
          value: true
        - target_field: intake_open
          value: false
  item.rejected:
    advances_to: rejected
    data_accumulation:
      writes:
        - target_field: intake_ready
          value: false
        - target_field: score_ready
          value: false
        - target_field: delivery_ready
          value: false
