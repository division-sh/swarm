processing-node:
  state_table: processing_node_state
  gate_state:
    score_ready: gate set when score is ready
  item.review_requested:
    guard: policy.delivery_enabled
    compute:
      operation: pick_or_average
      store_as: score
      keys:
        numeric_keys:
          - score
      tiers:
        - dimensions:
            - score
          weight: 1.0
    rules:
      - when: payload.score >= 80.0
        advances_to: approved
        emit:
          event: item.completed
      - advances_to: rejected
        emit:
          event: item.rejected
    sets_gate: score_ready
    clear_gates:
      - intake_open
  item.rejected:
    advances_to: rejected
    clear_gates:
      - intake_ready
      - score_ready
      - delivery_ready
