worker:
  item.registered:
    data_accumulation:
      writes:
        - {source_field: batch_id, target_field: batch_id}
        - {source_field: item_id, target_field: item_id}
        - {source_field: value, target_field: value}
  item.finished:
    rules:
      - when: _entity.current_state == 'registered' && has(entity.batch_id) && has(entity.item_id) && has(entity.value)
        emit:
          event: item.reported
          fields:
            item_id: entity.item_id
            batch_id: entity.batch_id
            value: entity.value
        advances_to: complete
