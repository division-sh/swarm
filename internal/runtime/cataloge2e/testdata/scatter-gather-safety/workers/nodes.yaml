worker:
  item.registered:
    data_accumulation:
      writes:
        - {source_field: batch_id, target_field: batch_id}
        - {source_field: item_id, target_field: item_id}
        - {source_field: value, target_field: value}
  item.finished:
    rules:
      - when: instance.stage == 'registered' && has(state.batch_id) && has(state.item_id) && has(state.value)
        emit:
          event: item.reported
          fields:
            item_id: state.item_id
            batch_id: state.batch_id
            value: state.value
        advances_to: complete
