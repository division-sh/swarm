stages:
  collecting:
    timers:
      - {after: 72h, advances_to: closed}
  closed:
    final: true
pins:
  inputs:
    - batch.submitted
    - batch.finished
    - batch.opened
  outputs:
    - item.registered
    - item.finished
    - batch.opened
connect:
  - {event: batch.opened, from: ., to: collector, resolution: create}
  - {event: item.registered, from: ., to: workers, resolution: select-or-create}
  - {event: item.finished, from: ., to: workers, resolution: select}
  - {event: item.reported, from: workers, to: collector, resolution: select}
