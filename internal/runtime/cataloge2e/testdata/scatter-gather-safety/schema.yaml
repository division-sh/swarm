stages:
  collecting:
    initial: true
    timers:
      - {after: 72h, advances_to: closed}
  closed:
    terminal: true
pins:
  inputs:
    events:
      - batch.submitted
      - batch.finished
      - batch.opened
  outputs:
    events: [item.registered, item.finished, batch.opened]
connect:
  - {event: batch.opened, from: ., to: collector}
  - {event: item.registered, from: ., to: workers, resolution: select-or-create}
  - {event: item.finished, from: ., to: workers, resolution: select}
  - {event: item.reported, from: workers, to: collector}
