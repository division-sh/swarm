inspect-node:
  worker.inspect:
    loop: {start: inspection, from: idle}
    advances_to: working
    emit:
      event: worker.execute
      fields: {revision_id: loop.revision_id}
activity-node:
  worker.execute:
    loop: {admit: inspection, from: working}
    advances_to: executing
    activity:
      id: terminal_probe
      tool: terminal_probe
      input: {}
activity-result-node:
  terminal_probe.succeeded:
    loop: {close: inspection, from: executing}
    advances_to: complete
activity-repeat-node:
  worker.retry:
    loop: {repeat: inspection, from: executing}
    advances_to: working
    emit:
      event: worker.execute
      fields: {revision_id: loop.revision_id}
