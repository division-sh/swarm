mode: template
instance: worker_id
stages:
  idle:
    initial: true
    timers:
      - after: 20ms
        advances_to: complete
  complete:
    terminal: true
pins:
  inputs:
    events:
      - event: worker.inspect.requested
        resolution: {mode: select}
      - event: worker.ready.requested
        resolution: {mode: select}
  outputs:
    events: [worker.observed]
