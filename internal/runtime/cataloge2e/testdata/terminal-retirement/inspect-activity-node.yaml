inspect-node:
  id: inspect-node
  execution_type: system_node
  subscribes_to: [worker.inspect]
  event_handlers:
    worker.inspect:
      activity:
        id: terminal_probe
        tool: terminal_probe
        input: {}
activity-result-node:
  id: activity-result-node
  execution_type: system_node
  subscribes_to: [terminal_probe.succeeded]
  event_handlers:
    terminal_probe.succeeded:
      advances_to: complete
