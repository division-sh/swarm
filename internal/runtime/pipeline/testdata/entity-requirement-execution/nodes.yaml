node-a:
  work.ready:
    accumulate:
      into: items
      from: payload
  work.clear:
    data_accumulation:
      writes:
        - op: clear
          target: entity.revision_count
        - op: clear
          target: entity.dedup_key
        - op: clear
          target: entity.accumulated_count
  work.kill:
    guard:
      id: stop-work
      check: |-
        false
      on_fail: kill
