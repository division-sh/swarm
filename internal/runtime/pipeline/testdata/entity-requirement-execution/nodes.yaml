node-a:
  work.ready:
    accumulate:
      target: items
      key: item_id
  work.clear:
    data_accumulation:
      writes:
        - op: clear
          target: state.revision_count
        - op: clear
          target: state.dedup_key
        - op: clear
          target: state.accumulated_count
  work.kill:
    rules:
      - when: false
      - advances_to: killed
        terminate: true
