node-a:
  execution_type: system_node
  event_handlers:
    work.ready:
      accumulate:
        into: items
        from: payload
    work.clear:
      data_accumulation:
        writes:
          - op: clear
            target: state.revision_count
          - op: clear
            target: state.dedup_key
          - op: clear
            target: state.accumulated_count
    work.kill:
      guard:
        id: stop-work
        check: |-
          false
        on_fail: kill
