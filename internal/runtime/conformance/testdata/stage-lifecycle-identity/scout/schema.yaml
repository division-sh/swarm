name: scout
instance: batch_id
stages:
  collecting:
    initial: true
  review:
    timers:
      - id: review_timeout
        after: 10m
        advances_to: timed_out
    gate:
      decision: approve_scout
      title: Approve scout batch
      outcomes:
        approve:
          label: Approve
          advances_to: awaiting
  awaiting: {}
  complete:
    terminal: true
  timed_out:
    terminal: true
pins:
  inputs:
    events:
      - scout.setup
      - scout.member.done
