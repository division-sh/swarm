name: scout
instance: batch_id
stages:
  collecting: {}
  review:
    timers:
      - id: review_timeout
        after: 10m
        advances_to: timed_out
    gate:
      decision: approve_scout
      title: Approve scout batch
      outcomes:
        approve:
          label: Approve
          advances_to: awaiting
  awaiting: {}
  complete:
    final: true
  timed_out:
    final: true
pins:
  inputs:
    - scout.setup
    - scout.member.done
