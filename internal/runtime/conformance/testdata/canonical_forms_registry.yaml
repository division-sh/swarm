status: checked_merge_bearing
census_head: 25ad370da
decoder_census_head: issue-2486-pack-platform
scope:
  loader_root: LoadWorkflowContractBundle
  included:
    - schema.yaml
    - types.yaml
    - entities.yaml
    - events.yaml
    - nodes.yaml
    - agents.yaml
    - tools.yaml
    - policy.yaml
    - project pack inventory/envelope/connector/channel YAML admitted by the bundle loader
    - embedded packs
    - CLI archetype contract YAML
    - authoritative platform-spec fields consumed while compiling those contracts
  excluded:
    - deployment swarm.yaml
    - prompt content
    - opaque authored data values
    - API DTO JSON
  declared_second_wave:
    - provider-trigger manifest YAML
    - scenario/test YAML
  note: >-
    Provider-trigger import declarations in schema.yaml imports are included. The provider-trigger
    manifest grammar itself is the explicitly ruled second-wave census.

classification_tests:
  fact: "If removed, no total spec-defined function of the remaining admitted contract reconstructs the same identity or semantic content."
  choice: "Two values are valid and select different allowed behavior; neither is mechanically implied by other admitted facts."
  derived_projection: "A total, deterministic, spec-anchored function of admitted facts/choices reconstructs the value."
  annotation: "Changing it cannot alter identity, admission, routing, execution, persistence, or observable outcome."
  boundary_snapshot: "A frozen copy is required only because the contract crosses a package/world boundary. Intra-package copies never qualify."
  semantically_distinct_override: "The alternate changes the derived result and is required for a non-default case."
  retired_duplicate_spelling: "The alternate carries no information not present in the canonical spelling."
  f2_bug: "An accepted spelling changes, disappears, or is independently reinterpreted after decode."

additive_document_families:
  - id: source.flow_manifest
    ruled: issue-2376-issue-2322-gate-F
    paths: "flow-disposition manifest.yaml.name, .version, .platform_version"
    owner: internal/sourceartifact.projectManifest
    substrate: admitted yamlsource.Value
    consumers: [sourceartifact construction, sourceartifact stored decode, contracts root compatibility, CLI identity-only source selection, artifact human presentation, verify JSON metadata]
    grammar: "optional document; if present, exactly three required nonempty text fields; strict SemVer and existing platform-range grammar; no unknown/duplicate fields or alternate reader"
    scope: "root compatibility only; nested grammar admission; resource/document basename lookalikes retain disposition"
    accounting: "one new typed document family; zero custom UnmarshalYAML decoders, zero raw node sites, zero direct YAML roots added; replaces opaque-positive manifest admission, not a historical custom decoder"
    retired_public_readers: [serve persisted-hash selection, event publish authored-hash guard, data import authored-hash guard, data show authored-hash guard, data prune authored-hash guard, run start authored-hash guard, run fork authored-hash selection, static agent frame branch, channel connect authored-hash alias, channel reconnect authored-hash alias, channel rebind authored-hash alias, channel status authored-hash alias]
    denominator_rule: "additive to the historical 45-row/11-decoder/67-site/24-root receipt; no reset or closure claim for #2300/#2287/#2293, #2486 or #2487"

