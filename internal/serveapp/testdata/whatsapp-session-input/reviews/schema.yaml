name: reviews
stages:
  waiting: {}
  review:
    gate:
      decision: review_decision
      context: {detail: entity.detail}
      outcomes:
        approve: {advances_to: done}
        reject:
          input:
            reason: {type: text, required: true}
            count: {type: integer, required: true}
            note: {type: text, required: false}
          advances_to: done
  done: {final: true}
pins:
  inputs: [work.requested]
