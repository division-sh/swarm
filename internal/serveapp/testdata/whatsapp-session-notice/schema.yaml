name: whatsapp-session-notice
imports:
  provider_trigger_events:
    - provider: whatsapp
      event: inbound.whatsapp.message
stages:
  active:
    gate:
      decision: retire_service
      outcomes:
        retire:
          advances_to: done
  done:
    final: true
inputs:
  - inbound.whatsapp
  - notice.requested
outputs:
  - inbound.whatsapp.message
  - notice.requested
ingress:
  alias: reception
  providers:
    - provider: whatsapp
connect:
  - {event: notice.requested, from: ., to: notices}
