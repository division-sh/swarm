name: whatsapp-session
imports:
  provider_trigger_events:
    - provider: whatsapp
      event: inbound.whatsapp.message
stages:
  active:
    gate:
      decision: retire_service
      outcomes:
        retire:
          advances_to: done
  done:
    final: true
inputs:
  - inbound.whatsapp
outputs:
  - inbound.whatsapp.message
ingress:
  alias: reception
  providers:
    - provider: whatsapp
