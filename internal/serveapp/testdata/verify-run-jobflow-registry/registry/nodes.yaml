registry-intake:
  company.registered:
    data_accumulation:
      writes:
        - source_field: slug
          target_field: slug
        - source_field: name
          target_field: name
        - source_field: eng_roles
          target_field: eng_roles
    advances_to: investigating
    emit:
      event: company.evaluation.requested
      fields:
        slug: state.slug
registry-evaluate:
  company.evaluation.requested:
    data_accumulation:
      writes:
        - target_field: verdict
          value: |
            state.eng_roles >= 7 ? 'qualified' : 'watchlist'
    advances_to: assessed
    emit:
      event: company.status
      fields:
        slug: state.slug
        name: state.name
        eng_roles: state.eng_roles
        verdict: state.verdict
registry-finalize:
  company.status:
    advances_to: done
