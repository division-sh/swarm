mutating_api_parity_ledger:
  - method: bundle.register
    classification: dual_backend_served_proof
    backends: [default_sqlite, explicit_postgres]
    scenario: bundle_register_lifecycle
    proof_refs:
      - {kind: go_test, name: TestServedParityHarnessBundleRegisterLifecycle}
    notes: >
      The real served harness proves canonical insertion, keyed and catalog
      replay, malformed rejection, exact conflict detection, transaction
      rollback and retry, catalog-only behavior, and bounded bundle.list
      readback through the selected SQLite and PostgreSQL owners. Full
      bundle.get read cardinality remains tracked by #2334.
  - method: event.publish
    classification: dual_backend_served_proof
    backends: [default_sqlite, explicit_postgres]
    scenario: event_publish_dynamic_auto_emit_lifecycle
    proof_refs:
      - kind: go_test
        name: TestServedParityHarnessEventPublishDynamicAutoEmitLifecycle
    notes: >
      Shared harness owns backend iteration and generic settlement postconditions
      for the #1384 dynamic auto_emit served lifecycle regression.
  - method: event.replay
    classification: dual_backend_served_proof
    backends: [default_sqlite, explicit_postgres]
    scenario: event_replay_live_agent_lifecycle
    proof_refs:
      - {kind: go_test, name: TestServedParityHarnessLiveAgentEventReplayLifecycle}
    notes: >
      Shared served harness proves real /v1/rpc event.replay against a live
      load-agent recipient on default SQLite and explicit Postgres, including
      canonical replay/audit events, source-delivery lineage, idempotency replay,
      delivered replay delivery, and generic settlement postconditions.
  - method: bundle.delete
    classification: postgres_only_with_spec_ref
    backends: [postgres_only]
    spec_ref: platform-spec.yaml#engine.runtime_core_persistence_store_contracts.optional_public_mutating_backend_support.bundle_delete
    proof_refs:
      - {kind: artifact, path: platform-spec.yaml}
      - {kind: go_test, name: TestOperatorBundleDeleteForceUsesOwnerChainAndIdempotency}
      - {kind: go_test, name: TestRunServeRuntimeSQLiteOptionalMutatorsFailClosed}
  - method: run.fork
    classification: dual_backend_served_proof
    backends: [default_sqlite, explicit_postgres]
    scenario: run_fork_lifecycle
    spec_ref: platform-spec.yaml#engine.runtime_core_persistence_store_contracts.optional_public_mutating_backend_support.run_fork
    proof_refs:
      - {kind: artifact, path: platform-spec.yaml}
      - {kind: go_test, name: TestServedParityHarnessRunForkLifecycle}
    notes: >
      The shared served harness proves the same event.publish, run.fork,
      settlement, terminal run, and public readback lifecycle through
      selected SQLite and PostgreSQL stores. The same-invocation development
      scratch proof remains an additional SQLite execution surface.
  - method: agent.replay
    classification: dual_backend_served_proof
    backends: [default_sqlite, explicit_postgres]
    scenario: agent_replay_live_agent_lifecycle
    proof_refs:
      - {kind: go_test, name: TestServedParityHarnessLiveAgentEventReplayLifecycle}
    notes: >
      Shared served harness proves real /v1/rpc agent.replay as the canonical
      event.replay projection for one live load-agent recipient on default
      SQLite and explicit Postgres, including source-delivery lineage,
      idempotency replay, delivered replay delivery, and generic settlement.
  - method: run.start
    classification: covered_transitively
    backends: [default_sqlite, explicit_postgres]
    covered_by_method: event.publish
    covered_by_scenario: event_publish_dynamic_auto_emit_lifecycle
    proof_refs:
      - kind: go_test
        name: TestServedParityHarnessEventPublishDynamicAutoEmitLifecycle
    notes: >
      Deprecated wrapper over event.publish. The wrapper delegates to the
      canonical event-publication owner, and served dual-backend parity is
      covered transitively by the event.publish servedparity scenario rather
      than by a dedicated wrapper scenario.
  - method: run.stop
    classification: dual_backend_served_proof
    backends: [default_sqlite, explicit_postgres]
    scenario: run_stop_control_lifecycle
    proof_refs:
      - kind: go_test
        name: TestServedParityHarnessRunControlLifecycle
    notes: >
      Shared served harness proves real /v1/rpc run.stop on default SQLite and
      explicit Postgres, including persisted stop state, pending-agent delivery
      abandonment, idempotency replay, and generic settlement postconditions.
  - method: run.pause
    classification: dual_backend_served_proof
    backends: [default_sqlite, explicit_postgres]
    scenario: run_pause_control_lifecycle
    proof_refs:
      - kind: go_test
        name: TestServedParityHarnessRunControlLifecycle
    notes: >
      Shared served harness proves real /v1/rpc run.pause on default SQLite and
      explicit Postgres, including run_control_state persistence, run-scoped
      dispatch gating, idempotency replay, and generic settlement postconditions.
  - method: run.continue
    classification: dual_backend_served_proof
    backends: [default_sqlite, explicit_postgres]
    scenario: run_continue_control_lifecycle
    proof_refs:
      - kind: go_test
        name: TestServedParityHarnessRunControlLifecycle
    notes: >
      Shared served harness proves real /v1/rpc run.continue on default SQLite
      and explicit Postgres, including release of run-scoped queued work exactly
      through the EventBus owner, idempotency replay, and generic settlement.
