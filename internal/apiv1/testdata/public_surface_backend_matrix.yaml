version: 1
kind: public_surface_backend_matrix
issue: 1268
issue_role: canonical_owner
source:
  platform_spec: platform-spec.yaml
  openrpc_artifact: openrpc.json
  adjacent_openrpc_matrix: internal/apiv1/testdata/openrpc_compliance_matrix.yaml
policy:
  closure_level: matrix_owner_first_slice_complete
  claims_parent_closure: false
  full_proof_projection: catalog-full
  required_smoke_policy: >
    Required PR smoke is row/accounting validation plus the smallest selected-backend
    proof refs needed for launch-critical SQLite-default and explicit-Postgres
    public surfaces. The matrix composes existing selected-store, real v1 handler,
    and CLI exact-method proofs instead of expanding every surface into a backend
    Cartesian product.
  mutating_api_parity_classification_policy: >
    Every mutating public method must be classified as direct
    dual_backend_served_proof, covered_transitively, postgres_only_with_spec_ref,
    unsupported_with_issue_ref, or split_with_issue_ref. Deprecated wrapper
    methods whose behavior is inherited from a directly proven mutating method
    use covered_transitively and must name the covered method, covered harness
    scenario, and live proof refs; this classification must not be used as a
    generic bypass for methods with independent backend-sensitive behavior.
  operator_read_api_parity_classification_policy: >
    Every non-mutating public method must be classified as dual_backend_api_proof,
    postgres_only_with_spec_ref, unsupported_with_issue_ref, split_with_issue_ref,
    or different_semantic_concept_with_proof. Dual-backend read proof must include
    selected-backend public-surface evidence for default SQLite and explicit
    Postgres; fake-store OpenRPC probes and store-unit tests alone do not count
    as selected-backend parity proof. Non-HTTP subscription/protocol methods must
    be classified explicitly rather than omitted.
store_parity:
  issue: 2275
  closure_level: store_prevention_first_slice_eliminated
  claims_parent_closure: false
  proof_policy_path: .github/test-proof-plan.yaml
  selected_purposes:
    - id: runtime
      constructor: OpenRuntime
      consumers: [internal/serveapp/main.go, internal/serveapp/store_runtime.go, internal/serveapp/store_capabilities.go]
      semantic_owner: internal/store/selected.Owner
      proof_ids: [runtime-open-sqlite, runtime-open-postgres, runtime-port-projection, connected-channel-onboarding-surface, bundle-delete-postgres, sqlite-optional-mutators-fail-closed, served-selected-contract-fork, destructive-reset-postgres]
      close_proof_ids: [runtime-close-postgres-ping, runtime-close-unactivated]
    - id: authority_inspection
      constructor: OpenAuthorityInspection
      consumers: [internal/cliapp/store_authority.go]
      semantic_owner: internal/runtime/startupownership inspection through internal/store/selected
      proof_ids: [authority-inspection-sqlite, authority-inspection-postgres]
      close_proof_ids: [authority-inspection-close]
    - id: authority_maintenance
      constructor: OpenAuthorityMaintenance
      consumers: [internal/cliapp/store_authority.go]
      semantic_owner: internal/runtime/startupownership maintenance through internal/store/selected
      proof_ids: [authority-repair-parity, authority-maintenance-sqlite]
      close_proof_ids: [authority-maintenance-close]
  different_construction:
    runtime_deps: [Config, Options, StartupGrant]
  composite_owners:
    - {id: runtime_event_bus, parent: RuntimeDeps.EventBusDurable, role_source_path: internal/runtime/bus/eventbus.go, role_type: DurableDependencies}
    - id: runtime_manager
      parent: RuntimeDeps.ManagerPersistenceRoles
      role_source_path: internal/runtime/manager/types.go
      role_type: PersistenceRoles
      different_construction: [AgentRoutes, FlowActivation, RouteInstaller, RouteVerifier, RouteRestorer, RouteRetirer, RouteRemover, FlowTermination, CreationPublisher, DeliveryRuntime]
    - {id: runtime_workflow, parent: RuntimeDeps.WorkflowPersistence, role_source_path: internal/runtime/pipeline/workflow_instance_store.go, role_type: WorkflowPersistenceOwner, interface_members: true, projection_constructor: NewWorkflowPersistence}
    - {id: product_bundle_delete, parent: productPorts.bundleDelete, role_source_path: internal/store/selected/selected.go, role_type: BundleDelete}
    - {id: product_conversation_fork, parent: productPorts.conversationFork, role_source_path: internal/store/selected/selected.go, role_type: ConversationFork}
    - {id: product_run_fork, parent: productPorts.runFork, role_source_path: internal/store/selected/selected.go, role_type: RunFork}
    - {id: product_destructive_reset, parent: productPorts.destructiveReset, role_source_path: internal/store/selected/selected.go, role_type: DestructiveReset}
    - {id: product_startup_recovery, parent: productPorts.startupRecovery, role_source_path: internal/store/selected/selected.go, role_type: StartupRecovery}
  proof_catalog:
    - {id: runtime-open-sqlite, kind: go_test, name: TestOpenRuntimeSQLiteResolvesRequiredAndOptionalProductsOnce, path: internal/store/selected/selected_test.go, profile: pr-common, backends: [default_sqlite], purpose_ids: [runtime]}
